openapi: 3.1.0
info:
    title: SIMBAR - Sistem Manajemen Inventori
    version: 0.4.0
    description: |
        API contract for Sistem Manajemen Inventori (SIMBAR) per FSD v0.1.

        - Base path: `/api/v1`, JSON, `Content-Type: application/json`.
        - Protected endpoints require `Authorization: Bearer <access-token>` (JWT, 15 min)
          and the `X-Warehouse-Id` header with a warehouse code the user is assigned to.
        - Every response uses the `ApiResponse` envelope; errors carry a machine-readable
          `code` (see FSD §5.4) plus optional per-field `details`.
        - All client input failures return `422 ERR_VALIDATION` with field details.
        - `POST /auth/login` is rate limited to 5 attempts / 15 min per IP; `POST /auth/register` to 10 / 15 min.

servers:
    - url: /api/v1
      description: Same origin (behind reverse proxy)
    - url: /
      description: path for observability

tags:
    - name: System
    - name: Auth
    - name: Items
    - name: Locations
    - name: Partners
    - name: Stock
    - name: Inbound M2
    - name: Outbound M4
    - name: Transfers M5
    - name: Counting M6
    - name: API Docs

security:
    - bearerAuth: []
    - cookieAuth: []

paths:
    /ping:
        get:
            tags: [System]
            summary: Health ping
            security: []
            responses:
                "200":
                    description: pong
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/ApiResponse" }

    /auth/login:
        post:
            tags: [Auth]
            summary: Login and issue access + refresh tokens
            description: |
                Sets HttpOnly cookies on success: `access_token` (path `/`, 15 min) and
                `refresh_token` (path `/api/v1/auth`, 7 days), SameSite=Lax, Secure over TLS.
                The tokens are also returned in the JSON body for non-browser clients.
            security: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema: { $ref: "#/components/schemas/LoginRequest" }
            responses:
                "200":
                    description: Token pair issued (also as Set-Cookie headers)
                    headers:
                        Set-Cookie:
                            description: "HttpOnly auth cookies (access_token, refresh_token)"
                            schema: { type: string }
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - {
                                          $ref: "#/components/schemas/ApiResponse",
                                      }
                                    - type: object
                                      properties:
                                          data:
                                              {
                                                  $ref: "#/components/schemas/TokenPair",
                                              }
                "401":
                    $ref: "#/components/responses/Error"
                "422":
                    $ref: "#/components/responses/ValidationError"
                "429":
                    $ref: "#/components/responses/RateLimited"

    /auth/register:
        post:
            tags: [Auth]
            summary: Register a new user (Argon2id password, min 12 chars)
            security: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema: { $ref: "#/components/schemas/RegisterRequest" }
            responses:
                "201":
                    description: User created
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - {
                                          $ref: "#/components/schemas/ApiResponse",
                                      }
                                    - type: object
                                      properties:
                                          data:
                                              {
                                                  $ref: "#/components/schemas/RegisterResponse",
                                              }
                "409":
                    $ref: "#/components/responses/Error"
                "422":
                    $ref: "#/components/responses/ValidationError"
                "429":
                    $ref: "#/components/responses/RateLimited"

    /auth/refresh:
        post:
            tags: [Auth]
            summary: Rotate refresh token and issue a new pair
            security: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema: { $ref: "#/components/schemas/RefreshRequest" }
            responses:
                "200":
                    description: New token pair issued (old refresh token revoked)
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - {
                                          $ref: "#/components/schemas/ApiResponse",
                                      }
                                    - type: object
                                      properties:
                                          data:
                                              {
                                                  $ref: "#/components/schemas/TokenPair",
                                              }
                "401":
                    $ref: "#/components/responses/Error"
                "422":
                    $ref: "#/components/responses/ValidationError"

    /auth/logout:
        post:
            tags: [Auth]
            summary: Revoke the refresh token
            security: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema: { $ref: "#/components/schemas/RefreshRequest" }
            responses:
                "200":
                    description: Logged out (idempotent)
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/ApiResponse" }
                "422":
                    $ref: "#/components/responses/ValidationError"

    /items:
        get:
            tags: [Items]
            summary: List all items
            description: Requires `item.read`.
            parameters: [{ $ref: "#/components/parameters/XWarehouseId" }]
            responses:
                "200":
                    description: Item list
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - {
                                          $ref: "#/components/schemas/ApiResponse",
                                      }
                                    - type: object
                                      properties:
                                          data:
                                              type: array
                                              items:
                                                  {
                                                      $ref: "#/components/schemas/Item",
                                                  }
                "401": { $ref: "#/components/responses/Error" }
                "403": { $ref: "#/components/responses/Error" }
        post:
            tags: [Items]
            summary: Create an item
            description: Requires `item.write`. Body limited to 1 MB.
            parameters: [{ $ref: "#/components/parameters/XWarehouseId" }]
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            { $ref: "#/components/schemas/CreateItemRequest" }
            responses:
                "201":
                    description: Item created
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - {
                                          $ref: "#/components/schemas/ApiResponse",
                                      }
                                    - type: object
                                      properties:
                                          data:
                                              {
                                                  $ref: "#/components/schemas/ItemDetail",
                                              }
                "401": { $ref: "#/components/responses/Error" }
                "403": { $ref: "#/components/responses/Error" }
                "409": { $ref: "#/components/responses/Error" }
                "422": { $ref: "#/components/responses/ValidationError" }

    /items/import:
        post:
            tags: [Items]
            summary: Import items from CSV (async)
            description: |
                Requires `item.import`. Multipart upload (10 MB max) with field `file`
                containing a CSV whose header must include `sku`, `name`, `base_uom`.
                Returns 202 with a `job_id` immediately.

                Validasi (422 ERR_VALIDATION): field `file` wajib ada; file harus
                bisa dibaca sebagai CSV; header wajib memuat kolom `sku`, `name`,
                `base_uom` — kolom lain diabaikan. Ukuran > 10 MB -> 413.
            parameters: [{ $ref: "#/components/parameters/XWarehouseId" }]
            requestBody:
                required: true
                content:
                    multipart/form-data:
                        schema:
                            type: object
                            required: [file]
                            properties:
                                file: { type: string, format: binary }
            responses:
                "202":
                    description: Import job queued
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - {
                                          $ref: "#/components/schemas/ApiResponse",
                                      }
                                    - type: object
                                      properties:
                                          data:
                                              {
                                                  $ref: "#/components/schemas/ImportJobResponse",
                                              }
                "401": { $ref: "#/components/responses/Error" }
                "403": { $ref: "#/components/responses/Error" }
                "413": { $ref: "#/components/responses/Error" }
                "422": { $ref: "#/components/responses/ValidationError" }

    /items/{id}:
        get:
            tags: [Items]
            summary: Get item by ID with its UoMs
            description: Requires `item.read`.
            parameters:
                - { $ref: "#/components/parameters/XWarehouseId" }
                - { $ref: "#/components/parameters/ItemID" }
            responses:
                "200":
                    description: Item with UoMs
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - {
                                          $ref: "#/components/schemas/ApiResponse",
                                      }
                                    - type: object
                                      properties:
                                          data:
                                              type: object
                                              properties:
                                                  item:
                                                      {
                                                          $ref: "#/components/schemas/ItemDetail",
                                                      }
                                                  uoms:
                                                      type: array
                                                      items:
                                                          {
                                                              $ref: "#/components/schemas/ItemUoM",
                                                          }
                "401": { $ref: "#/components/responses/Error" }
                "403": { $ref: "#/components/responses/Error" }
                "404": { $ref: "#/components/responses/Error" }
                "422": { $ref: "#/components/responses/ValidationError" }
        patch:
            tags: [Items]
            summary: Update an item
            description: Requires `item.write`. Body limited to 1 MB.
            parameters:
                - { $ref: "#/components/parameters/XWarehouseId" }
                - { $ref: "#/components/parameters/ItemID" }
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            { $ref: "#/components/schemas/UpdateItemRequest" }
            responses:
                "200":
                    description: Item updated
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - {
                                          $ref: "#/components/schemas/ApiResponse",
                                      }
                                    - type: object
                                      properties:
                                          data:
                                              {
                                                  $ref: "#/components/schemas/ItemDetail",
                                              }
                "401": { $ref: "#/components/responses/Error" }
                "403": { $ref: "#/components/responses/Error" }
                "404": { $ref: "#/components/responses/Error" }
                "422": { $ref: "#/components/responses/ValidationError" }
        delete:
            tags: [Items]
            summary: Soft-delete an item (set is_active=false)
            description: Requires `item.write`.
            parameters:
                - { $ref: "#/components/parameters/XWarehouseId" }
                - { $ref: "#/components/parameters/ItemID" }
            responses:
                "200":
                    description: Item deactivated
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/ApiResponse" }
                "401": { $ref: "#/components/responses/Error" }
                "403": { $ref: "#/components/responses/Error" }
                "422": { $ref: "#/components/responses/ValidationError" }

    /locations:
        get:
            tags: [Locations]
            summary: List locations of a warehouse
            description: Requires `location.read`.
            parameters:
                - { $ref: "#/components/parameters/XWarehouseId" }
                - name: warehouse_id
                  in: query
                  required: true
                  description: "Wajib, bilangan bulat positif (422 bila kosong/bukan angka)"
                  schema: { type: integer, format: int64, minimum: 1 }
            responses:
                "200":
                    description: Location list
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - {
                                          $ref: "#/components/schemas/ApiResponse",
                                      }
                                    - type: object
                                      properties:
                                          data:
                                              type: array
                                              items:
                                                  {
                                                      $ref: "#/components/schemas/Location",
                                                  }
                "401": { $ref: "#/components/responses/Error" }
                "403": { $ref: "#/components/responses/Error" }
                "422": { $ref: "#/components/responses/ValidationError" }
        post:
            tags: [Locations]
            summary: Create a location bin
            description: Requires `location.write`. Body limited to 1 MB.
            parameters: [{ $ref: "#/components/parameters/XWarehouseId" }]
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            {
                                $ref: "#/components/schemas/CreateLocationRequest",
                            }
            responses:
                "201":
                    description: Location created
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - {
                                          $ref: "#/components/schemas/ApiResponse",
                                      }
                                    - type: object
                                      properties:
                                          data:
                                              {
                                                  $ref: "#/components/schemas/Location",
                                              }
                "401": { $ref: "#/components/responses/Error" }
                "403": { $ref: "#/components/responses/Error" }
                "409": { $ref: "#/components/responses/Error" }
                "422": { $ref: "#/components/responses/ValidationError" }

    /partners:
        get:
            tags: [Partners]
            summary: List all partners
            description: Requires `partner.read`.
            parameters: [{ $ref: "#/components/parameters/XWarehouseId" }]
            responses:
                "200":
                    description: Partner list
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - {
                                          $ref: "#/components/schemas/ApiResponse",
                                      }
                                    - type: object
                                      properties:
                                          data:
                                              type: array
                                              items:
                                                  {
                                                      $ref: "#/components/schemas/Partner",
                                                  }
                "401": { $ref: "#/components/responses/Error" }
                "403": { $ref: "#/components/responses/Error" }
        post:
            tags: [Partners]
            summary: Create a partner
            description: Requires `partner.write`. Body limited to 1 MB. Contact name/phone are encrypted at rest.
            parameters: [{ $ref: "#/components/parameters/XWarehouseId" }]
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            {
                                $ref: "#/components/schemas/CreatePartnerRequest",
                            }
            responses:
                "201":
                    description: Partner created
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - {
                                          $ref: "#/components/schemas/ApiResponse",
                                      }
                                    - type: object
                                      properties:
                                          data:
                                              {
                                                  $ref: "#/components/schemas/Partner",
                                              }
                "401": { $ref: "#/components/responses/Error" }
                "403": { $ref: "#/components/responses/Error" }
                "409": { $ref: "#/components/responses/Error" }
                "422": { $ref: "#/components/responses/ValidationError" }

    /partners/{id}:
        get:
            tags: [Partners]
            summary: Get partner by ID
            description: Requires `partner.read`.
            parameters:
                - { $ref: "#/components/parameters/XWarehouseId" }
                - name: id
                  in: path
                  required: true
                  schema: { type: integer, format: int64, minimum: 1 }
            responses:
                "200":
                    description: Partner
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - {
                                          $ref: "#/components/schemas/ApiResponse",
                                      }
                                    - type: object
                                      properties:
                                          data:
                                              {
                                                  $ref: "#/components/schemas/Partner",
                                              }
                "401": { $ref: "#/components/responses/Error" }
                "403": { $ref: "#/components/responses/Error" }
                "404": { $ref: "#/components/responses/Error" }
                "422": { $ref: "#/components/responses/ValidationError" }
        patch:
            tags: [Partners]
            summary: Update a partner
            description: |
                Requires `partner.write`. Full-form replace (frontend sends the
                whole partner). Body limited to 1 MB. Contact name/phone are
                encrypted at rest. 404 if the partner does not exist; 409 if a
                duplicate code is supplied.
            parameters:
                - { $ref: "#/components/parameters/XWarehouseId" }
                - name: id
                  in: path
                  required: true
                  schema: { type: integer, format: int64, minimum: 1 }
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            {
                                $ref: "#/components/schemas/UpdatePartnerRequest",
                            }
            responses:
                "200":
                    description: Partner updated
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - {
                                          $ref: "#/components/schemas/ApiResponse",
                                      }
                                    - type: object
                                      properties:
                                          data:
                                              {
                                                  $ref: "#/components/schemas/Partner",
                                              }
                "401": { $ref: "#/components/responses/Error" }
                "403": { $ref: "#/components/responses/Error" }
                "404": { $ref: "#/components/responses/Error" }
                "409": { $ref: "#/components/responses/Error" }
                "422": { $ref: "#/components/responses/ValidationError" }

    /categories:
        get:
            tags: [Items]
            summary: List active categories
            description: Requires `item.read`.
            parameters:
                - { $ref: "#/components/parameters/XWarehouseId" }
            responses:
                "200":
                    description: Category list
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - {
                                          $ref: "#/components/schemas/ApiResponse",
                                      }
                                    - type: object
                                      properties:
                                          data:
                                              type: array
                                              items:
                                                  {
                                                      $ref: "#/components/schemas/Category",
                                                  }
                "401": { $ref: "#/components/responses/Error" }
                "403": { $ref: "#/components/responses/Error" }

    /stock/movements:
        get:
            tags: [Stock]
            summary: Stock movements ledger (keyset pagination)
            description: |
                Requires `stock.read`. Date range is mandatory (partition pruning).
                Pagination is keyset-based via `cursor` / `next_cursor`.
            parameters:
                - { $ref: "#/components/parameters/XWarehouseId" }
                - name: start_time
                  in: query
                  required: true
                  description: RFC3339 timestamp (inclusive)
                  schema: { type: string, format: date-time }
                - name: end_time
                  in: query
                  required: true
                  description: "RFC3339 timestamp (inclusive), must be >= start_time"
                  schema: { type: string, format: date-time }
                - name: item_id
                  in: query
                  required: false
                  description: Optional item filter
                  schema: { type: integer, format: int64, minimum: 1 }
                - name: limit
                  in: query
                  required: false
                  description: "Page size, 1-100, default 50"
                  schema:
                      { type: integer, minimum: 1, maximum: 100, default: 50 }
                - name: cursor
                  in: query
                  required: false
                  description: Opaque keyset cursor from previous `next_cursor`
                  schema: { type: string }
            responses:
                "200":
                    description: Movements page
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - {
                                          $ref: "#/components/schemas/ApiResponse",
                                      }
                                    - type: object
                                      properties:
                                          data:
                                              {
                                                  $ref: "#/components/schemas/StockMovementList",
                                              }
                "401": { $ref: "#/components/responses/Error" }
                "403": { $ref: "#/components/responses/Error" }
                "422": { $ref: "#/components/responses/ValidationError" }

    /receipts:
        post:
            tags: [Inbound M2]
            summary: Create a GRN draft (Fase 6.1, FR-2.1)
            description: |
                Membuka draft penerimaan barang (GRN): header + lines divalidasi
                terhadap master data, batch di-resolve/dibuat, dan nomor dokumen
                `GRN/{WAREHOUSE}/{YYMM}/{SEQ:5}` dialokasikan — semuanya dalam satu
                transaksi (FSD 4.3).

                Requires `grn.create`. Body limited to 1 MB.

                Idempotensi (FSD 4.5): kirim `Idempotency-Key` (UUIDv4) — kunci
                berulang mengembalikan dokumen yang sudah ada tanpa duplikat
                (dalam mode idempotensi penuh: 200 dengan dokumen asli).

                Validasi (422 ERR_VALIDATION + field details): `warehouse_id`
                wajib & aktif; `lines` minimal 1; per baris — `item_id` dikenal &
                aktif, `qty` > 0, `uom` terdaftar di item, `batch_no` wajib untuk
                item batch-managed (dilarang untuk non-batch), `expiry_date`
                wajib untuk item expiry-managed (format YYYY-MM-DD), `status`
                salah satu available/quarantine/damaged; `Idempotency-Key` /
                `idempotency_key` harus UUIDv4.
            security:
                - bearerAuth: []
            parameters:
                - { $ref: "#/components/parameters/XWarehouseId" }
                - { $ref: "#/components/parameters/IdempotencyKey" }
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            {
                                $ref: "#/components/schemas/CreateReceiptRequest",
                            }
            responses:
                "201":
                    description: GRN draft created (or existing document replayed for the same idempotency key)
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - {
                                          $ref: "#/components/schemas/ApiResponse",
                                      }
                                    - type: object
                                      properties:
                                          data:
                                              {
                                                  $ref: "#/components/schemas/ReceiptDocument",
                                              }
                "401": { $ref: "#/components/responses/Error" }
                "403": { $ref: "#/components/responses/Error" }
                "422": { $ref: "#/components/responses/ValidationError" }

    /receipts/{id}/submit:
        post:
            tags: [Inbound M2]
            summary: Submit a GRN draft for approval (Fase 6.1, FSD 4.4)
            description: |
                Transisi `draft → submitted`. Requires `grn.approve` (FSD endpoint
                table memetakan submit dan approve ke `grn.approve`).

                Validasi (422): path `:id` harus bilangan bulat positif;
                dokumen harus berstatus `draft` (selain itu 409 ERR_INVALID_STATE);
                dokumen tidak ditemukan -> 404.
            security:
                - bearerAuth: []
            parameters:
                - { $ref: "#/components/parameters/XWarehouseId" }
                - { $ref: "#/components/parameters/ItemID" }
            responses:
                "200":
                    description: Submitted
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - {
                                          $ref: "#/components/schemas/ApiResponse",
                                      }
                                    - type: object
                                      properties:
                                          data:
                                              {
                                                  $ref: "#/components/schemas/ReceiptStatus",
                                              }
                "401": { $ref: "#/components/responses/Error" }
                "403": { $ref: "#/components/responses/Error" }
                "404": { $ref: "#/components/responses/Error" }
                "409": { $ref: "#/components/responses/Error" }
                "422": { $ref: "#/components/responses/ValidationError" }

    /receipts/{id}/approve:
        post:
            tags: [Inbound M2]
            summary: Approve a GRN and post stock to staging (Fase 6.2, BR-05)
            description: |
                Transisi `submitted → approved` dengan maker-checker:
                approver harus berbeda dari creator (ERR_SELF_APPROVAL, 403).
                Satu movement `receipt` per line (qty × conv_factor ke base UOM)
                diposting ke lokasi `staging` warehouse — posting mengikuti pola
                FSD 4.1: all-or-nothing dalam satu transaksi dengan dokumen status.
                Requires `grn.approve`.

                Validasi (422/403/409): path `:id` bilangan bulat positif;
                dokumen harus `submitted` (409 bila bukan); maker-checker —
                approver harus berbeda dari creator (403 ERR_SELF_APPROVAL);
                lokasi staging harus terkonfigurasi untuk warehouse (404);
                stok tidak cukup saat posting -> 409 ERR_STOCK_INSUFFICIENT.
            security:
                - bearerAuth: []
            parameters:
                - { $ref: "#/components/parameters/XWarehouseId" }
                - { $ref: "#/components/parameters/ItemID" }
            responses:
                "200":
                    description: Approved and posted to staging
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - {
                                          $ref: "#/components/schemas/ApiResponse",
                                      }
                                    - type: object
                                      properties:
                                          data:
                                              {
                                                  $ref: "#/components/schemas/ReceiptStatus",
                                              }
                "401": { $ref: "#/components/responses/Error" }
                "403": { $ref: "#/components/responses/Error" }
                "404": { $ref: "#/components/responses/Error" }
                "409": { $ref: "#/components/responses/Error" }
                "422": { $ref: "#/components/responses/ValidationError" }

    /receipts/{id}/putaway-suggestion:
        get:
            tags: [Inbound M2]
            summary: Putaway suggestion per line (Fase 6.3, FR-2.5)
            description: |
                Menilai lokasi pick/bulk warehouse untuk setiap line yang masih
                menunggu putaway (FR-2.5, FSD 4.2): item kelas-A mengutamakan
                pick face, `pick_seq` memutus urutan, dan lokasi yang tidak muat
                (kapasitas) dikecualikan. Hanya berlaku pada dokumen
                `approved`/`in_progress`. Requires `grn.putaway`.

                Validasi (422/409): path `:id` bilangan bulat positif; status
                dokumen harus `approved`/`in_progress` (409); dokumen tidak
                ditemukan -> 404. Line yang sudah penuh (qty_processed =
                qty_request) tidak ikut disarankan.
            security:
                - bearerAuth: []
            parameters:
                - { $ref: "#/components/parameters/XWarehouseId" }
                - { $ref: "#/components/parameters/ItemID" }
            responses:
                "200":
                    description: Suggestion list (empty when nothing left to store)
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - {
                                          $ref: "#/components/schemas/ApiResponse",
                                      }
                                    - type: object
                                      properties:
                                          data:
                                              type: array
                                              items:
                                                  {
                                                      $ref: "#/components/schemas/PutawaySuggestion",
                                                  }
                "401": { $ref: "#/components/responses/Error" }
                "403": { $ref: "#/components/responses/Error" }
                "404": { $ref: "#/components/responses/Error" }
                "409": { $ref: "#/components/responses/Error" }
                "422": { $ref: "#/components/responses/ValidationError" }

    /receipts/{id}/putaway:
        post:
            tags: [Inbound M2]
            summary: Execute putaway from staging to target bins (Fase 6.4, FR-2.5)
            description: |
                Per scan dibuat dua movement `internal_move` (staging −qty, target
                +qty) dan `qty_processed` line bertambah. Status dokumen maju
                `approved → in_progress → completed` begitu semua line tersimpan
                penuh (FSD 4.4). Validasi scan (line milik dokumen, qty ≤ sisa,
                lokasi ada) dilakukan sebelum transaksi — all-or-nothing.
                Requires `grn.putaway`.

                Validasi (422/409): `lines` minimal 1 scan; per scan — `line_id`
                harus milik dokumen ini, `qty` > 0 dan ≤ sisa qty line,
                `location_code` harus ada di warehouse yang sama (422);
                status dokumen harus `approved`/`in_progress` (409); stok staging
                tidak cukup -> 409 ERR_STOCK_INSUFFICIENT.
            security:
                - bearerAuth: []
            parameters:
                - { $ref: "#/components/parameters/XWarehouseId" }
                - { $ref: "#/components/parameters/ItemID" }
            requestBody:
                required: true
                content:
                    application/json:
                        schema: { $ref: "#/components/schemas/PutawayRequest" }
            responses:
                "200":
                    description: Putaway executed; status after the scans
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - {
                                          $ref: "#/components/schemas/ApiResponse",
                                      }
                                    - type: object
                                      properties:
                                          data:
                                              {
                                                  $ref: "#/components/schemas/ReceiptStatus",
                                              }
                "401": { $ref: "#/components/responses/Error" }
                "403": { $ref: "#/components/responses/Error" }
                "404": { $ref: "#/components/responses/Error" }
                "409": { $ref: "#/components/responses/Error" }
                "422": { $ref: "#/components/responses/ValidationError" }

    /receipts/{id}/attachments:
        get:
            tags: [Inbound M2]
            summary: List GRN attachment metadata (Fase 6, lampiran)
            description: |
                Mengembalikan metadata lampiran dokumen GRN (surat jalan, BAP
                QC, foto truk, dokumen lain) — bukan isi file. File URL dapat
                digunakan untuk unduh. Dokumen tidak ditemukan -> 404.
                Requires `grn.read`.
            security:
                - bearerAuth: []
            parameters:
                - { $ref: "#/components/parameters/XWarehouseId" }
                - { $ref: "#/components/parameters/ItemID" }
            responses:
                "200":
                    description: Attachment metadata list
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - {
                                          $ref: "#/components/schemas/ApiResponse",
                                      }
                                    - type: object
                                      properties:
                                          data:
                                              type: array
                                              items:
                                                  {
                                                      $ref: "#/components/schemas/AttachmentResponse",
                                                  }
                "401": { $ref: "#/components/responses/Error" }
                "403": { $ref: "#/components/responses/Error" }
                "404": { $ref: "#/components/responses/Error" }
                "422": { $ref: "#/components/responses/ValidationError" }

        post:
            tags: [Inbound M2]
            summary: Add a GRN attachment (metadata row) (Fase 6, lampiran)
            description: |
                Mencatat metadata lampiran pada dokumen GRN. Body limit 10M;
                file diharapkan diunggah terpisah dan `file_url` menunjuk ke
                hasilnya. Dokumen tidak ditemukan -> 404. Requires `grn.create`.

                Validasi (422): `category` salah satu enum; `file_name` wajib,
                maksimal 255 karakter; `file_size_bytes` >= 0; `file_url`
                wajib, maksimal 500 karakter.
            security:
                - bearerAuth: []
            parameters:
                - { $ref: "#/components/parameters/XWarehouseId" }
                - { $ref: "#/components/parameters/ItemID" }
                - { $ref: "#/components/parameters/IdempotencyKey" }
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            {
                                $ref: "#/components/schemas/AddAttachmentRequest",
                            }
            responses:
                "201":
                    description: Attachment metadata created
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - {
                                          $ref: "#/components/schemas/ApiResponse",
                                      }
                                    - type: object
                                      properties:
                                          data:
                                              {
                                                  $ref: "#/components/schemas/AttachmentResponse",
                                              }
                "401": { $ref: "#/components/responses/Error" }
                "403": { $ref: "#/components/responses/Error" }
                "404": { $ref: "#/components/responses/Error" }
                "422": { $ref: "#/components/responses/ValidationError" }

    /receipts/{id}/attachments/{attachment_id}:
        delete:
            tags: [Inbound M2]
            summary: Delete a GRN attachment (metadata row) (Fase 6, lampiran)
            description: |
                Menghapus metadata lampiran (dan mengosongkan daftar). Lampiran
                tidak ditemukan -> 404. Requires `grn.create`.
            security:
                - bearerAuth: []
            parameters:
                - { $ref: "#/components/parameters/XWarehouseId" }
                - { $ref: "#/components/parameters/ItemID" }
                - { $ref: "#/components/parameters/AttachmentID" }
            responses:
                "200":
                    description: Attachment deleted
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - {
                                          $ref: "#/components/schemas/ApiResponse",
                                      }
                                    - type: object
                                      properties:
                                          data:
                                              type: object
                                              properties:
                                                  deleted: { type: boolean }
                "401": { $ref: "#/components/responses/Error" }
                "403": { $ref: "#/components/responses/Error" }
                "404": { $ref: "#/components/responses/Error" }
                "422": { $ref: "#/components/responses/ValidationError" }

    /requests:
        post:
            tags: [Outbound M4]
            summary: Create a request (REQ) draft (Fase 7.1, FR-4.1)
            description: |
                Membuka draft permintaan barang dari unit internal/customer:
                header + lines divalidasi terhadap master data dan nomor
                dokumen `REQ/{WAREHOUSE}/{YYMM}/{SEQ:5}` dialokasikan dalam satu
                transaksi (FSD 4.3). Idempotensi via `Idempotency-Key` (FSD 4.5).
                Requires `request.create`.

                Validasi (422): `warehouse_id` wajib & aktif; `lines` minimal 1;
                per baris — `item_id` dikenal & aktif, `qty` > 0, `uom` terdaftar.
            security:
                - bearerAuth: []
            parameters:
                - { $ref: "#/components/parameters/XWarehouseId" }
                - { $ref: "#/components/parameters/IdempotencyKey" }
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            {
                                $ref: "#/components/schemas/CreateRequestRequest",
                            }
            responses:
                "201":
                    description: Request draft created (or replayed for the same idempotency key)
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - {
                                          $ref: "#/components/schemas/ApiResponse",
                                      }
                                    - type: object
                                      properties:
                                          data:
                                              {
                                                  $ref: "#/components/schemas/RequestDocument",
                                              }
                "401": { $ref: "#/components/responses/Error" }
                "403": { $ref: "#/components/responses/Error" }
                "422": { $ref: "#/components/responses/ValidationError" }

    /requests/{id}/submit:
        post:
            tags: [Outbound M4]
            summary: Submit a request for approval (Fase 7.1, FSD 4.4)
            description: |
                Transisi `draft → submitted`. Requires `request.approve`.
                Dokumen harus berstatus `draft` (selain itu 409 ERR_INVALID_STATE).
            security:
                - bearerAuth: []
            parameters:
                - { $ref: "#/components/parameters/XWarehouseId" }
                - { $ref: "#/components/parameters/ItemID" }
            responses:
                "200":
                    description: Submitted
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - {
                                          $ref: "#/components/schemas/ApiResponse",
                                      }
                                    - type: object
                                      properties:
                                          data:
                                              {
                                                  $ref: "#/components/schemas/OutboundStatus",
                                              }
                "401": { $ref: "#/components/responses/Error" }
                "403": { $ref: "#/components/responses/Error" }
                "404": { $ref: "#/components/responses/Error" }
                "409": { $ref: "#/components/responses/Error" }
                "422": { $ref: "#/components/responses/ValidationError" }

    /requests/{id}/approve:
        post:
            tags: [Outbound M4]
            summary: Approve a request (Fase 7.1, BR-05)
            description: |
                Transisi `submitted → approved` dengan maker-checker:
                approver harus berbeda dari creator (ERR_SELF_APPROVAL, 403).
                DO hanya bisa dibuat dari request berstatus `approved`.
                Requires `request.approve`.
            security:
                - bearerAuth: []
            parameters:
                - { $ref: "#/components/parameters/XWarehouseId" }
                - { $ref: "#/components/parameters/ItemID" }
            responses:
                "200":
                    description: Approved
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - {
                                          $ref: "#/components/schemas/ApiResponse",
                                      }
                                    - type: object
                                      properties:
                                          data:
                                              {
                                                  $ref: "#/components/schemas/OutboundStatus",
                                              }
                "401": { $ref: "#/components/responses/Error" }
                "403": { $ref: "#/components/responses/Error" }
                "404": { $ref: "#/components/responses/Error" }
                "409": { $ref: "#/components/responses/Error" }
                "422": { $ref: "#/components/responses/ValidationError" }

    /deliveries:
        post:
            tags: [Outbound M4]
            summary: Create a delivery order (DO) from an approved request (Fase 7.1, FR-4.1)
            description: |
                Membuat dokumen DO/Surat Jalan dari permintaan yang sudah
                disetujui: lines disalin dari request, `ref_doc_id` menunjuk
                request, nomor `DO/{WAREHOUSE}/{YYMM}/{SEQ:5}` dialokasikan
                dalam satu transaksi. Idempotensi via `Idempotency-Key`.
                Requires `do.create`.

                Validasi (422/404): `request_id` harus request (`REQ`) berstatus
                `approved` dengan minimal 1 line; `warehouse_id` wajib & aktif.
            security:
                - bearerAuth: []
            parameters:
                - { $ref: "#/components/parameters/XWarehouseId" }
                - { $ref: "#/components/parameters/IdempotencyKey" }
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            {
                                $ref: "#/components/schemas/CreateDeliveryRequest",
                            }
            responses:
                "201":
                    description: DO draft created (or replayed for the same idempotency key)
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - {
                                          $ref: "#/components/schemas/ApiResponse",
                                      }
                                    - type: object
                                      properties:
                                          data:
                                              {
                                                  $ref: "#/components/schemas/DeliveryDocument",
                                              }
                "401": { $ref: "#/components/responses/Error" }
                "403": { $ref: "#/components/responses/Error" }
                "404": { $ref: "#/components/responses/Error" }
                "409": { $ref: "#/components/responses/Error" }
                "422": { $ref: "#/components/responses/ValidationError" }

    /deliveries/{id}/submit:
        post:
            tags: [Outbound M4]
            summary: Submit a DO for approval (Fase 7.1, FSD 4.4)
            description: |
                Transisi `draft → submitted`. Requires `do.approve`.
            security:
                - bearerAuth: []
            parameters:
                - { $ref: "#/components/parameters/XWarehouseId" }
                - { $ref: "#/components/parameters/ItemID" }
            responses:
                "200":
                    description: Submitted
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - {
                                          $ref: "#/components/schemas/ApiResponse",
                                      }
                                    - type: object
                                      properties:
                                          data:
                                              {
                                                  $ref: "#/components/schemas/OutboundStatus",
                                              }
                "401": { $ref: "#/components/responses/Error" }
                "403": { $ref: "#/components/responses/Error" }
                "404": { $ref: "#/components/responses/Error" }
                "409": { $ref: "#/components/responses/Error" }
                "422": { $ref: "#/components/responses/ValidationError" }

    /deliveries/{id}/approve:
        post:
            tags: [Outbound M4]
            summary: Approve a DO (Fase 7.1, BR-05)
            description: |
                Transisi `submitted → approved` dengan maker-checker. Alokasi
                hanya bisa dilakukan pada DO berstatus `approved`.
                Requires `do.approve`.
            security:
                - bearerAuth: []
            parameters:
                - { $ref: "#/components/parameters/XWarehouseId" }
                - { $ref: "#/components/parameters/ItemID" }
            responses:
                "200":
                    description: Approved
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - {
                                          $ref: "#/components/schemas/ApiResponse",
                                      }
                                    - type: object
                                      properties:
                                          data:
                                              {
                                                  $ref: "#/components/schemas/OutboundStatus",
                                              }
                "401": { $ref: "#/components/responses/Error" }
                "403": { $ref: "#/components/responses/Error" }
                "404": { $ref: "#/components/responses/Error" }
                "409": { $ref: "#/components/responses/Error" }
                "422": { $ref: "#/components/responses/ValidationError" }

    /deliveries/{id}/allocate:
        post:
            tags: [Outbound M4]
            summary: Allocate stock FEFO/FIFO (Fase 7.2, FR-4.2)
            description: |
                Menjalankan engine alokasi: kandidat stok `available` di lokasi
                pick/bulk dikunci dengan `SELECT ... FOR UPDATE` dan diurutkan
                `expiry_date NULLS LAST, b.id, pick_seq` (FEFO untuk barang
                ber-expiry, FIFO sebagai tie-breaker). Setiap potongan membuat
                baris `doc.allocations` dan menaikkan `qty_reserved`. Jika saldo
                bebas tidak cukup, seluruh transaksi digagalkan dengan
                409 ERR_STOCK_INSUFFICIENT + detail kekurangan per line.
                Requires `do.allocate`; dokumen harus `approved`.

                Validasi (422): `lines` minimal 1; per baris — `line_id` milik
                DO ini, `qty` > 0 dan tidak melebihi sisa line.
            security:
                - bearerAuth: []
            parameters:
                - { $ref: "#/components/parameters/XWarehouseId" }
                - { $ref: "#/components/parameters/ItemID" }
            requestBody:
                required: true
                content:
                    application/json:
                        schema: { $ref: "#/components/schemas/AllocateRequest" }
            responses:
                "200":
                    description: Allocations created (qty_reserved increased)
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - {
                                          $ref: "#/components/schemas/ApiResponse",
                                      }
                                    - type: object
                                      properties:
                                          data:
                                              type: array
                                              items:
                                                  {
                                                      $ref: "#/components/schemas/AllocationResult",
                                                  }
                "401": { $ref: "#/components/responses/Error" }
                "403": { $ref: "#/components/responses/Error" }
                "404": { $ref: "#/components/responses/Error" }
                "409": { $ref: "#/components/responses/Error" }
                "422": { $ref: "#/components/responses/ValidationError" }

    /deliveries/{id}/allocate/override:
        post:
            tags: [Outbound M4]
            summary: Override allocation to specific balances (Fase 7.3)
            description: |
                Alokasi manual ke balance tertentu (diluar urutan FEFO/FIFO).
                Khusus pengguna dengan izin `outbound.override_allocation`
                (ditegakkan middleware) dan wajib mengisi `reason_code` yang
                disimpan di `doc.documents.reason_code`. Setiap line harus
                menentukan `balance_id`; balance harus available, non-expired,
                milik warehouse yang sama dan itemnya cocok dengan line.
            security:
                - bearerAuth: []
            parameters:
                - { $ref: "#/components/parameters/XWarehouseId" }
                - { $ref: "#/components/parameters/ItemID" }
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            {
                                $ref: "#/components/schemas/OverrideAllocateRequest",
                            }
            responses:
                "200":
                    description: Manual allocations created with reason recorded
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - {
                                          $ref: "#/components/schemas/ApiResponse",
                                      }
                                    - type: object
                                      properties:
                                          data:
                                              type: array
                                              items:
                                                  {
                                                      $ref: "#/components/schemas/AllocationResult",
                                                  }
                "401": { $ref: "#/components/responses/Error" }
                "403": { $ref: "#/components/responses/Error" }
                "404": { $ref: "#/components/responses/Error" }
                "409": { $ref: "#/components/responses/Error" }
                "422": { $ref: "#/components/responses/ValidationError" }

    /deliveries/{id}/picking-list:
        get:
            tags: [Outbound M4]
            summary: Picking list ordered by pick_seq (Fase 7.4, FR-4.3)
            description: |
                Daftar alokasi untuk pengambilan, diurutkan sekuensial
                `pick_seq NULLS LAST, code, id` untuk meminimalkan jarak jalan
                petugas. Dokumen harus `approved`/`in_progress`.
                Requires `do.pick`.
            security:
                - bearerAuth: []
            parameters:
                - { $ref: "#/components/parameters/XWarehouseId" }
                - { $ref: "#/components/parameters/ItemID" }
            responses:
                "200":
                    description: Picking list (JSON)
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - {
                                          $ref: "#/components/schemas/ApiResponse",
                                      }
                                    - type: object
                                      properties:
                                          data:
                                              type: array
                                              items:
                                                  {
                                                      $ref: "#/components/schemas/PickingListItem",
                                                  }
                "401": { $ref: "#/components/responses/Error" }
                "403": { $ref: "#/components/responses/Error" }
                "404": { $ref: "#/components/responses/Error" }
                "409": { $ref: "#/components/responses/Error" }
                "422": { $ref: "#/components/responses/ValidationError" }

    /deliveries/{id}/pick:
        post:
            tags: [Outbound M4]
            summary: Confirm picking via barcode scan (Fase 7.5, FR-4.4)
            description: |
                Menerima hasil scan petugas (allocation_id + barcode lokasi +
                barcode item + qty). Setiap scan divalidasi terhadap alokasi;
                jika barcode item/lokasi tidak cocok, proses langsung diblokir
                dengan 409 ERR_SCAN_MISMATCH dan tidak ada baris yang diproses.
                Scan yang valid menaikkan `qty_picked` alokasi dan
                `qty_processed` line. Requires `do.pick`.

                Validasi (422): `scans` minimal 1; per scan — `allocation_id`
                milik DO ini, `qty` > 0 dan ≤ sisa alokasi, barcode dikenal.
            security:
                - bearerAuth: []
            parameters:
                - { $ref: "#/components/parameters/XWarehouseId" }
                - { $ref: "#/components/parameters/ItemID" }
            requestBody:
                required: true
                content:
                    application/json:
                        schema: { $ref: "#/components/schemas/PickRequest" }
            responses:
                "200":
                    description: Picking confirmed
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - {
                                          $ref: "#/components/schemas/ApiResponse",
                                      }
                                    - type: object
                                      properties:
                                          data:
                                              {
                                                  $ref: "#/components/schemas/OutboundStatus",
                                              }
                "401": { $ref: "#/components/responses/Error" }
                "403": { $ref: "#/components/responses/Error" }
                "404": { $ref: "#/components/responses/Error" }
                "409": { $ref: "#/components/responses/Error" }
                "422": { $ref: "#/components/responses/ValidationError" }

    /deliveries/{id}/ship:
        post:
            tags: [Outbound M4]
            summary: Post shipment & issue surat jalan (Fase 7.6, FR-4.5)
            description: |
                Posting pengeluaran akhir: melepas reservasi, mengurangi
                `qty_onhand` dan `qty_reserved`, menulis baris `issue` negatif
                ke ledger stok (FSD 4.1), mencatat kendaraan/sopir ke
                `doc.deliveries`, dan mengubah status `approved → in_progress`.
                Membutuhkan minimal satu alokasi yang sudah di-pick.
                Requires `do.ship`.
            security:
                - bearerAuth: []
            parameters:
                - { $ref: "#/components/parameters/XWarehouseId" }
                - { $ref: "#/components/parameters/ItemID" }
            requestBody:
                required: true
                content:
                    application/json:
                        schema: { $ref: "#/components/schemas/ShipRequest" }
            responses:
                "200":
                    description: Shipped; status after posting
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - {
                                          $ref: "#/components/schemas/ApiResponse",
                                      }
                                    - type: object
                                      properties:
                                          data:
                                              {
                                                  $ref: "#/components/schemas/OutboundStatus",
                                              }
                "401": { $ref: "#/components/responses/Error" }
                "403": { $ref: "#/components/responses/Error" }
                "404": { $ref: "#/components/responses/Error" }
                "409": { $ref: "#/components/responses/Error" }
                "422": { $ref: "#/components/responses/ValidationError" }

    /deliveries/{id}/pod:
        post:
            tags: [Outbound M4]
            summary: Record proof of delivery & close document (Fase 7.7, FR-4.6)
            description: |
                Mencatat serah terima: nama penerima, waktu kedatangan, dan URL
                berkas foto/tanda tangan (diunggah klien terlebih dahulu). DO
                ditutup final `in_progress → completed` (BR-10). Requires
                `do.pod`; dokumen harus `in_progress`.

                Validasi (422): `received_by` wajib; `received_at` format
                RFC3339 bila diisi; dokumen harus `in_progress` (409).
            security:
                - bearerAuth: []
            parameters:
                - { $ref: "#/components/parameters/XWarehouseId" }
                - { $ref: "#/components/parameters/ItemID" }
            requestBody:
                required: true
                content:
                    application/json:
                        schema: { $ref: "#/components/schemas/PodRequest" }
            responses:
                "200":
                    description: POD recorded; document completed
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - {
                                          $ref: "#/components/schemas/ApiResponse",
                                      }
                                    - type: object
                                      properties:
                                          data:
                                              {
                                                  $ref: "#/components/schemas/OutboundStatus",
                                              }
                "401": { $ref: "#/components/responses/Error" }
                "403": { $ref: "#/components/responses/Error" }
                "404": { $ref: "#/components/responses/Error" }
                "409": { $ref: "#/components/responses/Error" }
                "422": { $ref: "#/components/responses/ValidationError" }

    /transfers:
        post:
            tags: [Transfers M5]
            summary: Create inter-warehouse transfer draft (Fase 8.1, FR-5.1)
            description: |
                Membuka dokumen `TRF` draft dari gudang asal ke gudang tujuan.
                Nomor dokumen `TRF/{KODE_GUDANG}/{YYMM}/{SEQ:5}`. Idempoten:
                kirim ulang `Idempotency-Key` yang sama mengembalikan dokumen
                yang sudah ada (FSD 4.5). Requires `transfer.create`.

                Validasi (422): minimal 1 baris; `qty > 0`; UoM harus
                terdaftar di item; gudang asal ≠ tujuan; kedua gudang aktif.
            security:
                - bearerAuth: []
            parameters:
                - { $ref: "#/components/parameters/XWarehouseId" }
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            {
                                $ref: "#/components/schemas/TransferCreateRequest",
                            }
            responses:
                "201":
                    description: Transfer draft created
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - {
                                          $ref: "#/components/schemas/ApiResponse",
                                      }
                                    - type: object
                                      properties:
                                          data:
                                              {
                                                  $ref: "#/components/schemas/TransferDocumentResponse",
                                              }
                "401": { $ref: "#/components/responses/Error" }
                "403": { $ref: "#/components/responses/Error" }
                "404": { $ref: "#/components/responses/Error" }
                "409": { $ref: "#/components/responses/Error" }
                "422": { $ref: "#/components/responses/ValidationError" }

    /transfers/{id}/submit:
        post:
            tags: [Transfers M5]
            summary: Submit transfer draft (FSD 4.4)
            description: "`draft → submitted`. Requires `transfer.approve`."
            security:
                - bearerAuth: []
            parameters:
                - { $ref: "#/components/parameters/XWarehouseId" }
                - { $ref: "#/components/parameters/ItemID" }
            responses:
                "200":
                    description: Transfer submitted
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - {
                                          $ref: "#/components/schemas/ApiResponse",
                                      }
                                    - type: object
                                      properties:
                                          data:
                                              {
                                                  $ref: "#/components/schemas/TransferStatusResponse",
                                              }
                "401": { $ref: "#/components/responses/Error" }
                "403": { $ref: "#/components/responses/Error" }
                "404": { $ref: "#/components/responses/Error" }
                "409": { $ref: "#/components/responses/Error" }
                "422": { $ref: "#/components/responses/ValidationError" }

    /transfers/{id}/approve:
        post:
            tags: [Transfers M5]
            summary: Approve transfer (maker-checker BR-05)
            description: |
                `submitted → approved`. Penyetuju harus berbeda dari pembuat
                dokumen (`ERR_SELF_APPROVAL` 403). Requires `transfer.approve`.
            security:
                - bearerAuth: []
            parameters:
                - { $ref: "#/components/parameters/XWarehouseId" }
                - { $ref: "#/components/parameters/ItemID" }
            responses:
                "200":
                    description: Transfer approved
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - {
                                          $ref: "#/components/schemas/ApiResponse",
                                      }
                                    - type: object
                                      properties:
                                          data:
                                              {
                                                  $ref: "#/components/schemas/TransferStatusResponse",
                                              }
                "401": { $ref: "#/components/responses/Error" }
                "403": { $ref: "#/components/responses/Error" }
                "404": { $ref: "#/components/responses/Error" }
                "409": { $ref: "#/components/responses/Error" }
                "422": { $ref: "#/components/responses/ValidationError" }

    /transfers/{id}/send:
        post:
            tags: [Transfers M5]
            summary: Send transfer — issue source stock, book in_transit (FR-5.1)
            description: |
                `approved → in_progress`. Mengurangi `qty_onhand` gudang asal
                (alokasi FEFO/FIFO, baris ledger `transfer_out`) dan memindahkan
                kuantitas ke baris saldo berstatus **in_transit** di lokasi
                transit gudang tujuan (`transfer_in`). Seluruh posting berjalan
                satu transaksi (FSD 4.1).

                Error (409): saldo asal tidak mencukupi
                `ERR_STOCK_INSUFFICIENT` + detail shortage per baris; gudang
                tujuan belum punya lokasi transit (422).
            security:
                - bearerAuth: []
            parameters:
                - { $ref: "#/components/parameters/XWarehouseId" }
                - { $ref: "#/components/parameters/ItemID" }
            responses:
                "200":
                    description: Transfer sent; stock in transit
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - {
                                          $ref: "#/components/schemas/ApiResponse",
                                      }
                                    - type: object
                                      properties:
                                          data:
                                              {
                                                  $ref: "#/components/schemas/TransferStatusResponse",
                                              }
                "401": { $ref: "#/components/responses/Error" }
                "403": { $ref: "#/components/responses/Error" }
                "404": { $ref: "#/components/responses/Error" }
                "409": { $ref: "#/components/responses/Error" }
                "422": { $ref: "#/components/responses/ValidationError" }

    /transfers/{id}/receive:
        post:
            tags: [Transfers M5]
            summary: Receive transfer at destination — close document (FR-5.1)
            description: |
                `in_progress → completed`. Memverifikasi jumlah barang yang
                sampai per baris: memindahkan saldo `in_transit` lokasi transit
                ke bin tujuan (status `available`) dan mencatat
                `doc.transfer_receipts`. Jika jumlah diterima < dikirim,
                selisih dicatat sebagai log audit severity `critical`
                (`transfer.receive_discrepancy`) sebagai pemicu notifikasi
                darurat. Seluruh baris dokumen wajib diterima dalam satu
                request.

                Validasi (422): `qty_received > 0` dan ≤ qty kirim; lokasi
                tujuan milik gudang tujuan & bertipe pick/bulk/staging;
                `batch_id` wajib untuk item batch-managed. Error (409):
                saldo `in_transit` tidak mencukupi.
            security:
                - bearerAuth: []
            parameters:
                - { $ref: "#/components/parameters/XWarehouseId" }
                - { $ref: "#/components/parameters/ItemID" }
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            {
                                $ref: "#/components/schemas/TransferReceiveRequest",
                            }
            responses:
                "200":
                    description: Transfer received; document completed
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - {
                                          $ref: "#/components/schemas/ApiResponse",
                                      }
                                    - type: object
                                      properties:
                                          data:
                                              {
                                                  $ref: "#/components/schemas/TransferStatusResponse",
                                              }
                "401": { $ref: "#/components/responses/Error" }
                "403": { $ref: "#/components/responses/Error" }
                "404": { $ref: "#/components/responses/Error" }
                "409": { $ref: "#/components/responses/Error" }
                "422": { $ref: "#/components/responses/ValidationError" }

    /counts:
        post:
            tags: [Counting M6]
            summary: Open count session with blind qty_system snapshot (FR-6.1)
            description: |
                Membuka sesi opname `CNT` (draft): backend melakukan snapshot
                instan kuantitas sistem per balance (status `available`) ke
                `doc.count_lines.qty_system`. Pola **Blind Count** —
                `qty_system` tidak pernah dikembalikan ke petugas penghitung.
                Scope snapshot dapat dipersempit via `zone` dan/atau `item_ids`.
                Requires `count.create`.

                Validasi (422): gudang aktif; `zone`/`item_ids` opsional.
            security:
                - bearerAuth: []
            parameters:
                - { $ref: "#/components/parameters/XWarehouseId" }
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            { $ref: "#/components/schemas/CountCreateRequest" }
            responses:
                "201":
                    description: Count session opened with snapshot lines
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - {
                                          $ref: "#/components/schemas/ApiResponse",
                                      }
                                    - type: object
                                      properties:
                                          data:
                                              {
                                                  $ref: "#/components/schemas/CountDocumentResponse",
                                              }
                "401": { $ref: "#/components/responses/Error" }
                "403": { $ref: "#/components/responses/Error" }
                "404": { $ref: "#/components/responses/Error" }
                "409": { $ref: "#/components/responses/Error" }
                "422": { $ref: "#/components/responses/ValidationError" }

    /counts/{id}:
        get:
            tags: [Counting M6]
            summary: Get count session detail with snapshot/result lines (M6.3)
            description: |
                Mengambil header sesi opname `CNT` beserta baris snapshot dan
                hasil hitung (supervisor/manager reconciliation view). Berbeda
                dengan `/documents/{id}` — baris opname hanya ada di
                `doc.count_lines` (qty_system, qty_counted, variance), sehingga
                endpoint khusus ini mengembalikannya. Menggunakan hak akses
                `stock.read` yang sudah tersedia.

                Param `blind=1` adalah varian layar petugas penghitung:
                `qty_system` TIDAK dikirim dalam payload (Blind Count FR-6.1).
                Tanpa param, `qty_system` disertakan untuk rekonsiliasi
                supervisor.
            security:
                - bearerAuth: []
            parameters:
                - { $ref: "#/components/parameters/XWarehouseId" }
                - name: id
                  in: path
                  required: true
                  schema: { type: integer, format: int64, minimum: 1 }
                - name: blind
                  in: query
                  required: false
                  schema: { type: boolean }
                  description: "Sembunyikan qty_system (Blind Count FR-6.1)"
            responses:
                "200":
                    description: Count session header + snapshot/result lines
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - {
                                          $ref: "#/components/schemas/ApiResponse",
                                      }
                                    - type: object
                                      properties:
                                          data:
                                              {
                                                  $ref: "#/components/schemas/CountDocumentDetail",
                                              }
                "401": { $ref: "#/components/responses/Error" }
                "403": { $ref: "#/components/responses/Error" }
                "404": { $ref: "#/components/responses/Error" }

    /counts/{id}/lines:
        post:
            tags: [Counting M6]
            summary: Input field count results (FR-6.2)
            description: |
                Petugas menginput `qty_counted` per baris snapshot. Backend
                menghitung `variance = qty_counted - qty_system` dan
                mengembalikan nilainya. Sesi harus masih terbuka (draft).
                Requires `count.execute`.

                Validasi (422): `count_line_id` milik sesi; `qty_counted ≥ 0`;
                sesi sudah diposting (409).
            security:
                - bearerAuth: []
            parameters:
                - { $ref: "#/components/parameters/XWarehouseId" }
                - { $ref: "#/components/parameters/ItemID" }
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            {
                                $ref: "#/components/schemas/InputCountLinesRequest",
                            }
            responses:
                "200":
                    description: Count lines recorded (with computed variance)
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - {
                                          $ref: "#/components/schemas/ApiResponse",
                                      }
                                    - type: object
                                      properties:
                                          data:
                                              type: array
                                              items:
                                                  {
                                                      $ref: "#/components/schemas/CountLineSummary",
                                                  }
                "401": { $ref: "#/components/responses/Error" }
                "403": { $ref: "#/components/responses/Error" }
                "404": { $ref: "#/components/responses/Error" }
                "409": { $ref: "#/components/responses/Error" }
                "422": { $ref: "#/components/responses/ValidationError" }

    /counts/{id}/post:
        post:
            tags: [Counting M6]
            summary: Approve & post count session adjustments (M6.4 - M6.5)
            description: |
                Menyetujui dan memposting penyesuaian opname: seluruh baris
                wajib sudah dihitung; pembuat ≠ penyetuju (BR-05). Bila total
                nilai selisih (`Σ |variance| × unit_cost` terakhir) melebihi
                ambang (default Rp 5.000.000), berlaku **persetujuan
                berjenjang**: `manager_approver_id` wajib dan harus berbeda
                dari pembuat maupun penyetuju (Supervisor → Inventory Manager).
                Penyesuaian dicatat di ledger sebagai movement
                `adjustment (ADJ)` dan dokumen ditutup `completed`.

                Error (409): saldo tidak mencukupi `ERR_STOCK_INSUFFICIENT`;
                ambang nilai variance butuh manager (422).
            security:
                - bearerAuth: []
            parameters:
                - { $ref: "#/components/parameters/XWarehouseId" }
                - { $ref: "#/components/parameters/ItemID" }
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            { $ref: "#/components/schemas/PostCountRequest" }
            responses:
                "200":
                    description: Count session posted (adjustments on ledger)
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - {
                                          $ref: "#/components/schemas/ApiResponse",
                                      }
                                    - type: object
                                      properties:
                                          data:
                                              {
                                                  $ref: "#/components/schemas/PostCountResponse",
                                              }
                "401": { $ref: "#/components/responses/Error" }
                "403": { $ref: "#/components/responses/Error" }
                "404": { $ref: "#/components/responses/Error" }
                "409": { $ref: "#/components/responses/Error" }
                "422": { $ref: "#/components/responses/ValidationError" }

    /adjustments:
        post:
            tags: [Counting M6]
            summary: Create direct manual adjustment (Fase 8.5, FR-6.5)
            description: |
                Penyesuaian langsung di luar stock opname (mis. barang rusak /
                hilang mendadak). `reason_code` dan penjelasan tertulis
                (`notes`) **wajib**. Posting langsung: dokumen `ADJ` dibuat dan
                langsung ditutup `completed`, movement `adjustment` dicatat di
                ledger (baris boleh positif/negatif, target status
                available/damaged/quarantine). Requires `adj.create`.

                Validasi (422): `reason_code` wajib (max 30); `notes` wajib;
                `qty ≠ 0`; `status` ∈ {available, damaged, quarantine}.
            security:
                - bearerAuth: []
            parameters:
                - { $ref: "#/components/parameters/XWarehouseId" }
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            {
                                $ref: "#/components/schemas/AdjustmentCreateRequest",
                            }
            responses:
                "201":
                    description: Adjustment posted (document completed)
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - {
                                          $ref: "#/components/schemas/ApiResponse",
                                      }
                                    - type: object
                                      properties:
                                          data:
                                              {
                                                  $ref: "#/components/schemas/AdjustmentDocumentResponse",
                                              }
                "401": { $ref: "#/components/responses/Error" }
                "403": { $ref: "#/components/responses/Error" }
                "404": { $ref: "#/components/responses/Error" }
                "409": { $ref: "#/components/responses/Error" }
                "422": { $ref: "#/components/responses/ValidationError" }

    # ═══════════════════ Fase 10 ═══════════════════
    # 10.4 Validasi kontrak: openapi_contract_test.go memastikan (1) dokumen
    # ini valid secara struktur, (2) setiap path+method di sini terdaftar di
    # router Echo, dan (3) response riil tervalidasi terhadap schema ini
    # (openapi3filter.ValidateResponse). Dokumen ini juga menjadi sumber
    # embedded spec di /api/v1/openapi.yaml dan Swagger UI (/swagger).
    # 10.5 Observability: endpoint /healthz, /readyz, /metrics di bawah.

    /healthz:
        get:
            tags: [Observability]
            summary: Liveness probe — proses API hidup
            description: |
                Selalu 200 selama proses berjalan. Tidak menyentuh dependensi
                (PostgreSQL/Redis) — gunakan /readyz untuk kesiapan sebenarnya.
            security: []
            responses:
                "200":
                    description: Service is alive
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    status: { type: string, example: ok }

    /readyz:
        get:
            tags: [Observability]
            summary: Readiness probe — dependensi siap (PostgreSQL & Redis)
            description: |
                Menjalankan ping ke PostgreSQL dan Redis secara paralel dengan
                timeout 2 detik. 200 bila semuanya naik; 503 bila salah satu
                gagal (detail per komponen di body).
            security: []
            responses:
                "200":
                    description: All dependencies are up
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    status: { type: string, example: ready }
                                    checks:
                                        type: object
                                        additionalProperties: { type: string }
                                        example: { postgres: up, redis: up }
                "503":
                    description: At least one dependency is down
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    status:
                                        { type: string, example: unavailable }
                                    checks:
                                        type: object
                                        additionalProperties: { type: string }
                                        example:
                                            {
                                                postgres: up,
                                                redis: "down: connection refused",
                                            }

    /metrics:
        get:
            tags: [Observability]
            summary: Prometheus metrics (text exposition format)
            description: |
                Metrik runtime SIMBAR (FSD §10.5):

                - `http_requests_total{method,path,status}` — jumlah request,
                  label path memakai route pattern agar cardinality terkendali.
                - `http_request_duration_seconds{quantile="0.95"}` — latensi
                  p95 (summary objectives 0.5/0.9/0.95/0.99).
                - `http_requests_in_flight` — request yang sedang diproses.
                - `db_pool_max_conns / total_conns / idle_conns /
                  acquired_conns` — okupansi koneksi PostgreSQL (pgxpool).
                - `asynq_queue_pending / active / archived{queue}` — kedalaman
                  antrean worker asynq per queue.
            security: []
            responses:
                "200":
                    description: Prometheus text exposition format
                    content:
                        text/plain; version=0.0.4:
                            schema: { type: string }

    /openapi.yaml:
        get:
            tags: [API Docs]
            summary: This OpenAPI spec (YAML)
            security: []
            responses:
                "200":
                    description: OpenAPI 3.1 YAML document
                    content:
                        application/yaml:
                            schema: { type: string }

    /openapi.json:
        get:
            tags: [API Docs]
            summary: This OpenAPI spec (JSON)
            security: []
            responses:
                "200":
                    description: OpenAPI 3.1 JSON document
                    content:
                        application/json:
                            schema: { type: object }

    # ─── Shared read / query endpoints (Fase 10.4) ───────────────────────
    /documents:
        get:
            tags: [Documents]
            summary: List documents across document types (GRN/REQ/DO/TRF/CNT/ADJ)
            description: |
                Requires `stock.read`. Filters use the `''` = no-filter convention.
                `warehouse_id` uses `0` = no filter.
            parameters:
                - name: doc_type
                  in: query
                  required: false
                  schema: { type: string, example: GRN }
                - name: status
                  in: query
                  required: false
                  schema: { type: string, example: submitted }
                - name: warehouse_id
                  in: query
                  required: false
                  schema: { type: integer, format: int64 }
                - name: limit
                  in: query
                  required: false
                  schema:
                      { type: integer, minimum: 1, maximum: 100, default: 50 }
                - name: offset
                  in: query
                  required: false
                  schema: { type: integer, minimum: 0, default: 0 }
            responses:
                "200":
                    description: Document list
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - {
                                          $ref: "#/components/schemas/ApiResponse",
                                      }
                                    - type: object
                                      properties:
                                          data:
                                              type: array
                                              items:
                                                  {
                                                      $ref: "#/components/schemas/DocumentSummary",
                                                  }
                "401":
                    $ref: "#/components/responses/Error"
                "403":
                    $ref: "#/components/responses/Error"

    /documents/{id}:
        get:
            tags: [Documents]
            summary: Document detail (header + source/dest warehouse + partner + lines)
            description: Requires `stock.read`.
            parameters:
                - { $ref: "#/components/parameters/XWarehouseId" }
                - name: id
                  in: path
                  required: true
                  schema: { type: integer, format: int64 }
            responses:
                "200":
                    description: Document detail
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - {
                                          $ref: "#/components/schemas/ApiResponse",
                                      }
                                    - type: object
                                      properties:
                                          data:
                                              {
                                                  $ref: "#/components/schemas/DocumentDetail",
                                              }
                "404":
                    $ref: "#/components/responses/Error"
                "401":
                    $ref: "#/components/responses/Error"

    /stock/balances:
        get:
            tags: [Stock]
            summary: Current stock balances per location/batch (warehouse-scoped)
            description: |
                Requires `stock.read`. `warehouse_code` defaults to the
                mandatory `X-Warehouse-Id` header (active warehouse).
            parameters:
                - { $ref: "#/components/parameters/XWarehouseId" }
                - name: warehouse_code
                  in: query
                  required: false
                  schema: { type: string, example: WH01 }
                - name: status
                  in: query
                  required: false
                  schema: { type: string, example: available }
                - name: search
                  in: query
                  required: false
                  description: Case-insensitive match on SKU or item name
                  schema: { type: string }
                - name: category_id
                  in: query
                  required: false
                  schema: { type: integer, format: int64 }
            responses:
                "200":
                    description: Stock balance list
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - {
                                          $ref: "#/components/schemas/ApiResponse",
                                      }
                                    - type: object
                                      properties:
                                          data:
                                              type: array
                                              items:
                                                  {
                                                      $ref: "#/components/schemas/StockBalance",
                                                  }
                "401":
                    $ref: "#/components/responses/Error"

    /stock/batches:
        get:
            tags: [Stock]
            summary: Batch traceability list with current balances
            description: |
                Requires `stock.read`. `search` matches batch_no, SKU or item name.
            parameters:
                - { $ref: "#/components/parameters/XWarehouseId" }
                - name: search
                  in: query
                  required: false
                  schema: { type: string }
            responses:
                "200":
                    description: Batch trace list
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - {
                                          $ref: "#/components/schemas/ApiResponse",
                                      }
                                    - type: object
                                      properties:
                                          data:
                                              type: array
                                              items:
                                                  {
                                                      $ref: "#/components/schemas/BatchTrace",
                                                  }
                "401":
                    $ref: "#/components/responses/Error"

    /stock/ledger:
        get:
            tags: [Stock]
            summary: Immutable movement ledger (stock card)
            description: |
                Requires `stock.read`. Returns movement rows joined with item,
                location, batch and operator. `item_id` filters to one item;
                `from`/`to` bound the moved_at window (RFC3339, both optional).
            parameters:
                - { $ref: "#/components/parameters/XWarehouseId" }
                - name: item_id
                  in: query
                  required: false
                  schema: { type: integer, format: int64 }
                - name: from
