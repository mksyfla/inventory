components:
    securitySchemes:
        bearerAuth:
            type: http
            scheme: bearer
            bearerFormat: JWT
        cookieAuth:
            type: apiKey
            in: cookie
            name: access_token
            description: |
                HttpOnly cookie set automatically by POST /auth/login and POST /auth/refresh
                (alternative to the Authorization header for browser clients).

    parameters:
        XWarehouseId:
            name: X-Warehouse-Id
            in: header
            required: true
            description: Active warehouse code (must be one of the user's assigned warehouses)
            schema: { type: string, example: WH01 }
        ItemID:
            name: id
            in: path
            required: true
            schema: { type: integer, format: int64, minimum: 1 }
        AttachmentID:
            name: attachment_id
            in: path
            required: true
            description: ID lampiran (dari GET /receipts/{id}/attachments)
            schema: { type: integer, format: int64, minimum: 1 }
        IdempotencyKey:
            name: Idempotency-Key
            in: header
            required: false
            description: |
                UUIDv4 idempotency key (FSD 4.5) — wajib pada semua POST yang
                memposting stok. Kunci disimpan di `doc.documents.idempotency_key`
                (UNIQUE); kirim ulang kunci yang sama mengembalikan dokumen yang
                sudah ada (200) alih-alih membuat duplikat. Nilai non-UUIDv4
                ditolak dengan 422 ERR_VALIDATION oleh middleware idempotensi.
            schema:
                {
                    type: string,
                    format: uuid,
                    example: 3f7c1b2e-6a4d-4f8e-9c2b-1d5a8e7f3a41,
                }

    responses:
        Error:
            description: Error response (FSD §5.4 envelope)
            content:
                application/json:
                    schema: { $ref: "#/components/schemas/ApiResponse" }
        ValidationError:
            description: Input validation failed (422 ERR_VALIDATION with field details)
            content:
                application/json:
                    schema: { $ref: "#/components/schemas/ApiResponse" }
        RateLimited:
            description: Rate limit exceeded (429)
            content:
                application/json:
                    schema: { $ref: "#/components/schemas/ApiResponse" }

    schemas:
        ApiResponse:
            type: object
            required: [success, data, error]
            properties:
                success: { type: boolean }
                data:
                    {
                        nullable: true,
                        description: "Payload; null pada response error",
                    }
                meta:
                    type: object
                    properties:
                        page_size: { type: integer }
                        next_cursor: { type: string }
                error:
                    nullable: true
                    allOf: [{ $ref: "#/components/schemas/ApiError" }]
        ApiError:
            type: object
            properties:
                code: { type: string, example: ERR_VALIDATION }
                message: { type: string }
                details:
                    type: array
                    items: { $ref: "#/components/schemas/ErrorDetail" }
                request_id: { type: string, format: uuid }
        ErrorDetail:
            type: object
            properties:
                field: { type: string, example: password }
                message:
                    {
                        type: string,
                        example: must be at least 12 characters long,
                    }
                sku: { type: string }
                requested: {}
                available: {}

        DocumentSummary:
            type: object
            properties:
                id: { type: integer, format: int64 }
                public_id: { type: string, format: uuid }
                doc_no: { type: string, example: GRN/WH01/2608/00001 }
                doc_type: { type: string, example: GRN }
                doc_date: { type: string, format: date }
                status: { type: string, example: submitted }
                warehouse_id: { type: integer, format: int64 }
                dest_warehouse_id:
                    { type: integer, format: int64, nullable: true }
                partner_id: { type: integer, format: int64, nullable: true }
                reason_code: { type: string }
                notes: { type: string }
                created_at: { type: string, format: date-time }
                created_by: { type: integer, format: int64 }
                submitted_at:
                    { type: string, format: date-time, nullable: true }
                approved_at: { type: string, format: date-time, nullable: true }
                approved_by: { type: integer, format: int64, nullable: true }
                completed_at:
                    { type: string, format: date-time, nullable: true }
                manager_approved_by:
                    { type: integer, format: int64, nullable: true }
                manager_approved_at:
                    { type: string, format: date-time, nullable: true }
                warehouse_code: { type: string }
                warehouse_name: { type: string }
                dest_warehouse_code: { type: string }
                dest_warehouse_name: { type: string }
                partner_code: { type: string }
                partner_name: { type: string }
                ref_doc_no: { type: string }
                line_count: { type: integer, format: int64 }

        DocumentLine:
            type: object
            properties:
                id: { type: integer, format: int64 }
                document_id: { type: integer, format: int64 }
                line_no: { type: integer }
                item_id: { type: integer, format: int64 }
                sku: { type: string }
                item_name: { type: string }
                uom: { type: string }
                conv_factor: { type: number, example: 1 }
                qty_request: { type: number }
                qty_processed: { type: number }
                batch_id: { type: integer, format: int64, nullable: true }
                location_id: { type: integer, format: int64, nullable: true }
                status: { type: string, example: pending }
                notes: { type: string }

        WarehouseRef:
            type: object
            properties:
                id: { type: integer, format: int64 }
                code: { type: string }
                name: { type: string }
                is_active: { type: boolean }

        PartnerRef:
            type: object
            properties:
                id: { type: integer, format: int64 }
                code: { type: string }
                partner_type: { type: string, example: supplier }
                name: { type: string }
                is_active: { type: boolean }

        DocumentDetail:
            type: object
            allOf:
                - { $ref: "#/components/schemas/DocumentSummary" }
                - type: object
                  properties:
                      source_warehouse:
                          { $ref: "#/components/schemas/WarehouseRef" }
                      dest_warehouse:
                          { $ref: "#/components/schemas/WarehouseRef" }
                      partner: { $ref: "#/components/schemas/PartnerRef" }
                      lines:
                          type: array
                          items: { $ref: "#/components/schemas/DocumentLine" }

        StockBalance:
            type: object
            properties:
                balance_id: { type: integer, format: int64 }
                item_id: { type: integer, format: int64 }
                sku: { type: string }
                item_name: { type: string }
                base_uom: { type: string }
                location_id: { type: integer, format: int64 }
                location_code: { type: string }
                zone: { type: string }
                rack: { type: string }
                level: { type: string }
                batch_id: { type: integer, format: int64, nullable: true }
                batch_no: { type: string }
                expiry_date: { type: string, format: date, nullable: true }
                status: { type: string, example: available }
                qty_onhand: { type: number }
                qty_reserved: { type: number }
                updated_at: { type: string, format: date-time }

        BatchTrace:
            type: object
            properties:
                batch_id: { type: integer, format: int64 }
                batch_no: { type: string }
                item_id: { type: integer, format: int64 }
                sku: { type: string }
                item_name: { type: string }
                base_uom: { type: string }
                mfg_date: { type: string, format: date, nullable: true }
                expiry_date: { type: string, format: date, nullable: true }
                balance_id: { type: integer, format: int64, nullable: true }
                location_id: { type: integer, format: int64, nullable: true }
                location_code: { type: string }
                status: { type: string }
                qty_onhand: { type: number }
                qty_reserved: { type: number }
                grn_no: { type: string }
                grn_date: { type: string, format: date, nullable: true }
                supplier_name: { type: string }

        StockLedger:
            type: object
            properties:
                id: { type: integer, format: int64 }
                moved_at: { type: string, format: date-time }
                item_id: { type: integer, format: int64 }
                sku: { type: string }
                item_name: { type: string }
                base_uom: { type: string }
                location_id: { type: integer, format: int64 }
                location_code: { type: string }
                batch_id: { type: integer, format: int64, nullable: true }
                batch_no: { type: string }
                status: { type: string }
                movement_type: { type: string, example: issue }
                qty: { type: number }
                qty_after: { type: number }
                doc_no: { type: string }
                created_by: { type: integer, format: int64 }
                operator_name: { type: string }

        Warehouse:
            type: object
            properties:
                id: { type: integer, format: int64 }
                code: { type: string, example: WH01 }
                name: { type: string }
                address: { type: string }
                is_active: { type: boolean }

        UserSummary:
            type: object
            properties:
                id: { type: integer, format: int64 }
                username: { type: string }
                email: { type: string }
                full_name: { type: string }
                phone: { type: string, nullable: true }
                is_active: { type: boolean }
                last_login_at:
                    { type: string, format: date-time, nullable: true }
                roles:
                    type: array
                    items: { type: string, example: sysadmin }
                warehouses:
                    type: array
                    items: { type: string, example: WH01 }
                warehouse_ids:
                    type: array
                    items: { type: integer, format: int64, example: 1 }

        RoleSummary:
            type: object
            properties:
                id: { type: integer, format: int64 }
                code: { type: string }
                name: { type: string }
                description: { type: string, nullable: true }
                permissions:
                    type: array
                    items: { type: string, example: stock.read }

        PermissionSummary:
            type: object
            properties:
                id: { type: integer, format: int64 }
                code: { type: string, example: item.read }

        CreateUserRequest:
            type: object
            required: [username, full_name, password]
            properties:
                username: { type: string, minLength: 3, maxLength: 50 }
                email: { type: string }
                full_name: { type: string }
                phone: { type: string }
                password: { type: string, format: password, minLength: 6 }
                is_active: { type: boolean, default: true }
                roles:
                    type: array
                    items: { type: string, example: INBOUND_STAFF }
                warehouse_ids:
                    type: array
                    items: { type: integer, format: int64 }

        UpdateUserRequest:
            type: object
            required: [full_name]
            properties:
                full_name: { type: string }
                email: { type: string }
                phone: { type: string }
                password: { type: string, format: password, minLength: 6 }
                is_active: { type: boolean, default: true }
                roles:
                    type: array
                    items: { type: string, example: INBOUND_STAFF }
                warehouse_ids:
                    type: array
                    items: { type: integer, format: int64 }

        CreateRoleRequest:
            type: object
            required: [code, name]
            properties:
                code: { type: string, minLength: 2, maxLength: 40 }
                name: { type: string, minLength: 2, maxLength: 100 }
                description: { type: string }
                permissions:
                    type: array
                    items: { type: string, example: item.read }

        UpdateRoleRequest:
            type: object
            required: [code, name]
            properties:
                code: { type: string, minLength: 2, maxLength: 40 }
                name: { type: string, minLength: 2, maxLength: 100 }
                description: { type: string }
                permissions:
                    type: array
                    items: { type: string, example: item.read }

        Settings:
            type: object
            additionalProperties: true
            description: Flat JSON object of system settings keyed by name (e.g. companyName, minStockThresholdPct).

        AuditLog:
            type: object
            properties:
                id: { type: integer, format: int64 }
                occurred_at: { type: string, format: date-time }
                user_id: { type: integer, format: int64, nullable: true }
                actor_username: { type: string }
                action: { type: string, example: approve }
                entity: { type: string, example: document }
                entity_id: { type: integer, format: int64, nullable: true }
                old_value: { type: object, nullable: true }
                new_value: { type: object, nullable: true }
                ip_address: { type: string }
                request_id: { type: string, format: uuid }

        FsnReportRow:
            type: object
            properties:
                id: { type: integer, format: int64 }
                sku: { type: string }
                item_name: { type: string }
                category_name: { type: string }
                base_uom: { type: string }
                last_movement_date: { type: string, format: date-time }
                fsn_category: { type: string, example: fast_moving }
                turnover_ratio: { type: integer }
                current_qty: { type: number }
                total_valuation: { type: number }

        ValuationReportRow:
            type: object
            properties:
                id: { type: integer, format: int64 }
                sku: { type: string }
                item_name: { type: string }
                category_name: { type: string }
                uom: { type: string }
                unit_price: { type: number }
                ending_qty: { type: number }
                ending_value: { type: number }
                inbound_qty: { type: number }
                inbound_value: { type: number }
                outbound_qty: { type: number }
                outbound_value: { type: number }

        SpaceUtilizationRow:
            type: object
            properties:
                warehouse_id: { type: integer, format: int64 }
                warehouse_code: { type: string }
                warehouse_name: { type: string }
                location_id: { type: integer, format: int64 }
                location_code: { type: string }
                zone_name: { type: string }
                loc_type: { type: string, example: storage }
                capacity_volume_m3: { type: number }
                used_volume_m3: { type: number }

        DashboardSummary:
            type: object
            properties:
                grn_today: { type: integer, format: int64 }
                do_today: { type: integer, format: int64 }
                req_open: { type: integer, format: int64 }
                do_open: { type: integer, format: int64 }
                below_min_items: { type: integer, format: int64 }
                total_valuation: { type: number }

        LoginRequest:
            type: object
            description: |
                Aturan validasi (422 ERR_VALIDATION + field details):
                - `username` wajib, 3-50 karakter.
                - `password` wajib (panjang tidak diperiksa saat login agar
                  kebijakan password tidak bocor ke penyerang).
                - Gagal 5x dalam 15 menit per IP -> 429 rate limited.
            required: [username, password]
            properties:
                username:
                    {
                        type: string,
                        minLength: 3,
                        maxLength: 50,
                        description: "Wajib, 3-50 karakter",
                    }
                password:
                    {
                        type: string,
                        description: "Wajib. Tidak ada batas panjang yang diberlakukan di sini",
                    }
        RegisterRequest:
            type: object
            description: |
                Aturan validasi (422 ERR_VALIDATION + field details):
                - `username` wajib, 3-50 karakter.
                - `email` wajib, format email valid, maksimal 150 karakter.
                - `full_name` wajib, 1-150 karakter.
                - `password` wajib, minimal 12 karakter (FSD §6), maksimal 72
                  (batas Argon2id). Disimpan sebagai hash Argon2id.
                - 10 percobaan / 15 menit per IP -> 429.
            required: [username, email, full_name, password]
            properties:
                username:
                    {
                        type: string,
                        minLength: 3,
                        maxLength: 50,
                        description: "Wajib, 3-50 karakter",
                    }
                email:
                    {
                        type: string,
                        format: email,
                        maxLength: 150,
                        description: "Wajib, format email valid, maksimal 150 karakter",
                    }
                full_name:
                    {
                        type: string,
                        minLength: 1,
                        maxLength: 150,
                        description: "Wajib, 1-150 karakter",
                    }
                password:
                    {
                        type: string,
                        minLength: 12,
                        maxLength: 72,
                        description: "Wajib, minimal 12 karakter (FSD §6), maksimal 72. Argon2id hashed server-side",
                    }
        RefreshRequest:
            type: object
            description: |
                Aturan validasi (422 ERR_VALIDATION + field details):
                - `refresh_token` wajib (tidak kosong).
            required: [refresh_token]
            properties:
                refresh_token:
                    {
                        type: string,
                        description: "Wajib. Refresh token JWT aktif (7 hari)",
                    }
        TokenPair:
            type: object
            properties:
                access_token: { type: string, description: "JWT, 15 min TTL" }
                refresh_token:
                    { type: string, description: "Rotating JWT, 7 day TTL" }
                token_type: { type: string, example: Bearer }
        RegisterResponse:
            type: object
            properties:
                id: { type: integer, format: int64 }
                username: { type: string }
                full_name: { type: string }

        ItemUoMInput:
            type: object
            description: |
                Aturan validasi (422): `uom` wajib 1-20 karakter; `conv_factor`
                wajib > 0; `barcode` optional maksimal 64 karakter.
            required: [uom, conv_factor]
            properties:
                uom:
                    {
                        type: string,
                        minLength: 1,
                        maxLength: 20,
                        description: "Wajib, 1-20 karakter",
                    }
                conv_factor:
                    {
                        type: number,
                        format: double,
                        exclusiveMinimum: 0,
                        description: "Wajib, > 0. Konversi ke base UOM (contoh 1 BOX = 24 PCS)",
                    }
                barcode:
                    {
                        type: string,
                        nullable: true,
                        maxLength: 64,
                        description: "Optional, maksimal 64 karakter",
                    }
        CreateItemRequest:
            type: object
            description: |
                Aturan validasi (422 ERR_VALIDATION + field details):
                - `sku`, `name`, `base_uom` wajib (1-50 / 1-150 / 1-20 karakter).
                - `min_qty`, `safety_stock`, `lead_time_days` >= 0.
                - `max_qty` optional, >= 0 dan harus >= `min_qty`.
                - `abc_class` salah satu dari A/B/C (kosong = belum diklasifikasi).
                - Setiap elemen `uoms` divalidasi (dive).
            required: [sku, name, base_uom]
            properties:
                sku:
                    {
                        type: string,
                        minLength: 1,
                        maxLength: 50,
                        description: "Wajib, 1-50 karakter, unik",
                    }
                name:
                    {
                        type: string,
                        minLength: 1,
                        maxLength: 150,
                        description: "Wajib, 1-150 karakter",
                    }
                category_id:
                    {
                        type: integer,
                        format: int64,
                        nullable: true,
                        minimum: 1,
                        description: "Optional (gt=0)",
                    }
                base_uom:
                    {
                        type: string,
                        minLength: 1,
                        maxLength: 20,
                        description: "Wajib, 1-20 karakter (contoh PCS/KG)",
                    }
                is_batch: { type: boolean, default: false }
                is_expiry:
                    {
                        type: boolean,
                        default: false,
                        description: "Requires is_batch=true",
                    }
                is_serial: { type: boolean, default: false }
                min_qty:
                    {
                        type: number,
                        format: double,
                        minimum: 0,
                        description: "Wajib, >= 0 (default 0)",
                    }
                max_qty:
                    {
                        type: number,
                        format: double,
                        nullable: true,
                        minimum: 0,
                        description: "Optional, >= 0 dan harus >= min_qty",
                    }
                safety_stock:
                    {
                        type: number,
                        format: double,
                        minimum: 0,
                        description: "Wajib, >= 0 (default 0)",
                    }
                lead_time_days:
                    {
                        type: integer,
                        minimum: 0,
                        description: "Wajib, >= 0 (default 0)",
                    }
                abc_class:
                    {
                        type: string,
                        nullable: true,
                        enum: [A, B, C],
                        description: "Optional, salah satu A/B/C",
                    }
                uoms:
                    type: array
                    description: Optional; setiap elemen divalidasi (dive)
                    items: { $ref: "#/components/schemas/ItemUoMInput" }
        UpdateItemRequest:
            type: object
            description: |
                Aturan validasi (422): `name`, `base_uom` wajib; `max_qty` >= 0
                dan >= `min_qty`; `abc_class` salah satu A/B/C; `lead_time_days`
                >= 0. Path `:id` harus bilangan bulat positif.
            required: [name, base_uom]
            properties:
                name:
                    {
                        type: string,
                        minLength: 1,
                        maxLength: 150,
                        description: "Wajib, 1-150 karakter",
                    }
                category_id:
                    {
                        type: integer,
                        format: int64,
                        nullable: true,
                        minimum: 1,
                        description: "Optional (gt=0)",
                    }
                base_uom:
                    {
                        type: string,
                        minLength: 1,
                        maxLength: 20,
                        description: "Wajib, 1-20 karakter",
                    }
                is_batch: { type: boolean }
                is_expiry: { type: boolean }
                is_serial: { type: boolean }
                min_qty:
                    {
                        type: number,
                        format: double,
                        minimum: 0,
                        description: "Wajib, >= 0",
                    }
                max_qty:
                    {
                        type: number,
                        format: double,
                        nullable: true,
                        minimum: 0,
                        description: "Optional, >= 0 dan harus >= min_qty",
                    }
                safety_stock:
                    {
                        type: number,
                        format: double,
                        minimum: 0,
                        description: "Wajib, >= 0",
                    }
                lead_time_days:
                    { type: integer, minimum: 0, description: "Wajib, >= 0" }
                abc_class:
                    {
                        type: string,
                        nullable: true,
                        enum: [A, B, C],
                        description: "Optional, salah satu A/B/C",
                    }
                is_active: { type: boolean }
        Item:
            type: object
            properties:
                id: { type: integer, format: int64 }
                public_id: { type: string, format: uuid }
                sku: { type: string }
                name: { type: string }
                category_id: { type: integer, format: int64, nullable: true }
                base_uom: { type: string }
                is_batch: { type: boolean }
                is_expiry: { type: boolean }
                is_serial: { type: boolean }
                min_qty: { type: number, format: double }
                max_qty: { type: number, format: double, nullable: true }
                safety_stock: { type: number, format: double }
                lead_time_days: { type: integer }
                abc_class: { type: string, nullable: true }
                is_active: { type: boolean }
        ItemDetail:
            allOf:
                - { $ref: "#/components/schemas/Item" }
                - type: object
                  properties:
                      created_at: { type: string, format: date-time }
                      created_by: { type: integer, format: int64 }
        ItemUoM:
            type: object
            properties:
                id: { type: integer, format: int64 }
                item_id: { type: integer, format: int64 }
                uom: { type: string }
                conv_factor: { type: number, format: double }
                barcode: { type: string, nullable: true }

        CreateLocationRequest:
            type: object
            description: |
                Aturan validasi (422 ERR_VALIDATION + field details):
                - `warehouse_id` wajib (gt=0), `code` wajib 1-30 karakter,
                  `loc_type` wajib salah satu enum.
                - `zone`/`rack`/`level` optional maksimal 20 karakter.
                - `pick_seq` optional >= 0; `capacity` optional >= 0.
                - `code` harus unik per warehouse (409 ERR_DUPLICATE_KEY).
            required: [warehouse_id, code, loc_type]
            properties:
                warehouse_id:
                    {
                        type: integer,
                        format: int64,
                        minimum: 1,
                        description: "Wajib, gt=0",
                    }
                code:
                    {
                        type: string,
                        minLength: 1,
                        maxLength: 30,
                        description: "Wajib, 1-30 karakter, unik per warehouse",
                    }
                zone:
                    {
                        type: string,
                        nullable: true,
                        maxLength: 20,
                        description: "Optional, maksimal 20 karakter",
                    }
                rack:
                    {
                        type: string,
                        nullable: true,
                        maxLength: 20,
                        description: "Optional, maksimal 20 karakter",
                    }
                level:
                    {
                        type: string,
                        nullable: true,
                        maxLength: 20,
                        description: "Optional, maksimal 20 karakter",
                    }
                loc_type:
                    {
                        type: string,
                        enum:
                            [staging, pick, bulk, quarantine, damaged, transit],
                        description: "Wajib, salah satu enum",
                    }
                pick_seq:
                    {
                        type: integer,
                        nullable: true,
                        minimum: 0,
                        description: "Optional, >= 0. Urutan picking (kecil = dipilih dulu)",
                    }
                capacity:
                    {
                        type: number,
                        format: double,
                        nullable: true,
                        minimum: 0,
                        description: "Optional, >= 0. Kapasitas maksimum lokasi (unit stok)",
                    }
        Location:
            type: object
            properties:
                id: { type: integer, format: int64 }
                warehouse_id: { type: integer, format: int64 }
                code: { type: string }
                zone: { type: string, nullable: true }
                rack: { type: string, nullable: true }
                level: { type: string, nullable: true }
                loc_type: { type: string }
                pick_seq: { type: integer, nullable: true }
                capacity: { type: number, format: double, nullable: true }
                is_active: { type: boolean }

        CreatePartnerRequest:
            type: object
            description: |
                Aturan validasi (422 ERR_VALIDATION + field details):
                - `code`, `partner_type`, `name` wajib (1-30 / enum / 1-150).
                - `address` optional maksimal 500; `contact_name` maksimal 100;
                  `contact_phone` maksimal 30.
                - `code` harus unik (409 ERR_DUPLICATE_KEY).
                - Data kontak dienkripsi saat istirahat (UU PDP).
            required: [code, partner_type, name]
            properties:
                code:
                    {
                        type: string,
                        minLength: 1,
                        maxLength: 30,
                        description: "Wajib, 1-30 karakter, unik",
                    }
                partner_type:
                    {
                        type: string,
                        enum: [supplier, customer, internal_unit],
                        description: "Wajib, salah satu enum",
                    }
                name:
                    {
                        type: string,
                        minLength: 1,
                        maxLength: 150,
                        description: "Wajib, 1-150 karakter",
                    }
                address:
                    {
                        type: string,
                        maxLength: 500,
                        description: "Optional, maksimal 500 karakter",
                    }
                contact_name:
                    {
                        type: string,
                        maxLength: 100,
                        description: "Optional, maksimal 100 karakter. Encrypted at rest (UU PDP)",
                    }
                contact_phone:
                    {
                        type: string,
                        maxLength: 30,
                        description: "Optional, maksimal 30 karakter. Encrypted at rest (UU PDP)",
                    }
        UpdatePartnerRequest:
            type: object
            description: |
                Body untuk PATCH /partners/{id}. Frontend selalu mengirim seluruh
                form (termasuk `code` yang non-editable di UI). Validasi sama dengan
                CreatePartnerRequest, ditambah `is_active` untuk toggle status.
            required: [code, partner_type, name, is_active]
            properties:
                code:
                    {
                        type: string,
                        minLength: 1,
                        maxLength: 30,
                        description: "Wajib, 1-30 karakter, unik",
                    }
                partner_type:
                    {
                        type: string,
                        enum: [supplier, customer, internal_unit],
                        description: "Wajib, salah satu enum",
                    }
                name:
                    {
                        type: string,
                        minLength: 1,
                        maxLength: 150,
                        description: "Wajib, 1-150 karakter",
                    }
                address:
                    {
                        type: string,
                        maxLength: 500,
                        description: "Optional, maksimal 500 karakter",
                    }
                contact_name:
                    {
                        type: string,
                        maxLength: 100,
                        description: "Optional, maksimal 100 karakter. Encrypted at rest (UU PDP)",
                    }
                contact_phone:
                    {
                        type: string,
                        maxLength: 30,
                        description: "Optional, maksimal 30 karakter. Encrypted at rest (UU PDP)",
                    }
                is_active:
                    { type: boolean, description: "Wajib, status aktif mitra" }
        Partner:
            type: object
            properties:
                id: { type: integer, format: int64 }
                code: { type: string }
                partner_type: { type: string }
                name: { type: string }
                address: { type: string, nullable: true }
                contact_name: { type: string, nullable: true }
                contact_phone: { type: string, nullable: true }
                is_active: { type: boolean }

        Category:
            type: object
            properties:
                id: { type: integer, format: int64 }
                code: { type: string }
                name: { type: string }
                is_active: { type: boolean }

        StockMovement:
            type: object
            properties:
                id: { type: integer, format: int64 }
                moved_at: { type: string, format: date-time }
                item_id: { type: integer, format: int64 }
                location_id: { type: integer, format: int64 }
                batch_id: { type: integer, format: int64, nullable: true }
                status:
                    {
                        type: string,
                        enum:
                            [
                                available,
                                quarantine,
                                damaged,
                                expired,
                                in_transit,
                            ],
                    }
                movement_type:
                    {
                        type: string,
                        enum:
                            [
                                receipt,
                                issue,
                                transfer_out,
                                transfer_in,
                                adjustment,
                                putaway,
                                internal_move,
                                return_in,
                                return_out,
                                opening,
                            ],
                    }
                qty:
                    {
                        type: number,
                        format: double,
                        description: "(+) in, (-) out",
                    }
                qty_after: { type: number, format: double }
                doc_no: { type: string }
        StockMovementList:
            type: object
            properties:
                data:
                    type: array
                    items: { $ref: "#/components/schemas/StockMovement" }
                next_cursor:
                    { type: string, description: Empty when no more pages }

        ImportJobResponse:
            type: object
            properties:
                job_id: { type: string }
                status: { type: string, example: queued }

        # ── Fase 6: Inbound M2 (GRN) ────────────────────────────────────────

        CreateReceiptRequest:
            type: object
            description: |
                Aturan validasi (422 ERR_VALIDATION + field details):
                - `warehouse_id` wajib (integer > 0) dan harus warehouse aktif.
                - `lines` wajib berisi minimal 1 baris; setiap baris divalidasi
                  terhadap master data (item aktif, qty > 0, UOM terdaftar,
                  batch/expiry sesuai atribut item, status hasil QC valid).
                - `idempotency_key` (bila ada) harus UUIDv4 — atau kirim lewat
                  header `Idempotency-Key` (FSD 4.5).
            required: [warehouse_id, lines]
            properties:
                warehouse_id:
                    {
                        type: integer,
                        format: int64,
                        minimum: 1,
                        description: "Wajib. ID warehouse tujuan (gt=0)",
                    }
                partner_id:
                    {
                        type: integer,
                        format: int64,
                        nullable: true,
                        minimum: 1,
                        description: "Optional. Supplier/vendor (gt=0)",
                    }
                idempotency_key:
                    {
                        type: string,
                        format: uuid,
                        description: "Optional UUIDv4 — alternatif dari header Idempotency-Key (FSD 4.5)",
                    }
                notes:
                    {
                        type: string,
                        maxLength: 1000,
                        description: "Optional. Maksimal 1000 karakter",
                    }
                lines:
                    type: array
                    minItems: 1
                    description: "Wajib, minimal 1 baris"
                    items: { $ref: "#/components/schemas/ReceiptLineRequest" }

        ReceiptLineRequest:
            type: object
            required: [item_id, qty]
            properties:
                item_id:
                    {
                        type: integer,
                        format: int64,
                        minimum: 1,
                        description: "Wajib. ID item master (gt=0); item harus aktif",
                    }
                qty:
                    {
                        type: number,
                        format: double,
                        exclusiveMinimum: 0,
                        description: "Wajib, > 0. Quantity dalam UOM baris (default: base UOM item)",
                    }
                uom:
                    {
                        type: string,
                        maxLength: 20,
                        description: "Optional. Kosong = base UOM item (contoh PCS/BOX/KG); harus terdaftar di item",
                    }
                batch_no:
                    {
                        type: string,
                        maxLength: 60,
                        description: "Wajib untuk item batch-managed (is_batch); dilarang untuk item non-batch",
                    }
                expiry_date:
                    {
                        type: string,
                        format: date,
                        description: "Wajib untuk item expiry-managed (is_expiry). Format YYYY-MM-DD",
                    }
                status:
                    {
                        type: string,
                        enum: [available, quarantine, damaged],
                        description: "Hasil QC saat penerimaan. Optional, default available",
                    }
                notes:
                    {
                        type: string,
                        maxLength: 500,
                        description: "Optional. Maksimal 500 karakter",
                    }

        ReceiptDocument:
            type: object
            properties:
                id: { type: integer, format: int64 }
                public_id: { type: string, format: uuid }
                doc_no: { type: string, example: "GRN/WH01/2608/00016" }
                doc_type: { type: string, example: GRN }
                doc_date: { type: string, format: date }
                status:
                    {
                        type: string,
                        enum:
                            [
                                draft,
                                submitted,
                                approved,
                                in_progress,
                                completed,
                                cancelled,
                            ],
                    }
                warehouse_id: { type: integer, format: int64 }
                notes: { type: string, nullable: true }
                created_by: { type: integer, format: int64 }
                lines:
                    type: array
                    items: { $ref: "#/components/schemas/ReceiptLineSummary" }

        ReceiptLineSummary:
            type: object
            properties:
                id: { type: integer, format: int64 }
                line_no: { type: integer }
                item_id: { type: integer, format: int64 }
                uom: { type: string }
                qty_request: { type: number, format: double }
                qty_processed: { type: number, format: double }
                batch_id: { type: integer, format: int64, nullable: true }
                location_id:
                    {
                        type: integer,
                        format: int64,
                        nullable: true,
                        description: "Target bin terakhir setelah putaway",
                    }
                status: { type: string, enum: [available, quarantine, damaged] }

        ReceiptStatus:
            type: object
            properties:
                id: { type: integer, format: int64 }
                status:
                    {
                        type: string,
                        description: "Status dokumen setelah aksi",
                        example: approved,
                    }

        AttachmentResponse:
            type: object
            properties:
                id: { type: integer, format: int64 }
                document_id: { type: integer, format: int64 }
                category:
                    {
                        type: string,
                        enum:
                            [delivery_note, qc_inspection, truck_photo, other],
                    }
                file_name: { type: string }
                file_size_bytes: { type: integer, format: int64 }
                file_url: { type: string }
                uploaded_by: { type: integer, format: int64 }
                created_at:
                    {
                        type: string,
                        format: date-time,
                        description: "Waktu unggah (RFC3339)",
                    }

        AddAttachmentRequest:
            type: object
            description: |
                Metadata lampiran GRN. File diharapkan diunggah terpisah;
                `file_url` menunjuk ke hasil unggah.
            required: [category, file_name, file_url]
            properties:
                category:
                    {
                        type: string,
                        enum:
                            [delivery_note, qc_inspection, truck_photo, other],
                        description: "Wajib. Jenis lampiran",
                    }
                file_name:
                    {
                        type: string,
                        maxLength: 255,
                        description: "Wajib. Nama file, maksimal 255 karakter",
                    }
                file_size_bytes:
                    {
                        type: integer,
                        format: int64,
                        minimum: 0,
                        default: 0,
                        description: "Opsional. Ukuran file dalam byte (>= 0)",
                    }
                file_url:
                    {
                        type: string,
                        maxLength: 500,
                        description: "Wajib. Lokasi file, maksimal 500 karakter",
                    }

        PutawayRequest:
            type: object
            description: |
                Aturan validasi (422 ERR_VALIDATION + field details):
                - `lines` wajib, minimal 1 scan.
                - Setiap scan divalidasi sebelum transaksi: line milik dokumen,
                  qty > 0 dan tidak melebihi sisa qty line, lokasi tujuan harus
                  milik warehouse yang sama.
            required: [lines]
            properties:
                lines:
                    type: array
                    minItems: 1
                    description: "Wajib, minimal 1 scan"
                    items: { $ref: "#/components/schemas/PutawayScanRequest" }

        PutawayScanRequest:
            type: object
            description: |
                Aturan validasi (422 ERR_VALIDATION + field details):
                - `line_id` wajib, bilangan bulat > 0 (gt=0), dan harus milik
                  dokumen GRN ini.
                - `qty` wajib, angka > 0 dan tidak boleh melebihi sisa qty
                  yang belum diputaway dari baris tersebut.
                - `location_code` wajib, string 1-30 karakter, dan harus
                  merupakan kode lokasi yang ada di warehouse dokumen ini
                  (bukan lokasi staging).
            required: [line_id, qty, location_code]
            properties:
                line_id:
                    {
                        type: integer,
                        format: int64,
                        minimum: 1,
                        description: "Wajib. ID baris dokumen GRN (gt=0) yang sedang diputaway",
                    }
                qty:
                    {
                        type: number,
                        format: double,
                        exclusiveMinimum: 0,
                        description: "Wajib, > 0. Dalam UOM line; tidak boleh melebihi sisa qty line",
                    }
                location_code:
                    {
                        type: string,
                        maxLength: 30,
                        description: "Wajib. Kode bin tujuan (pick/bulk) milik warehouse yang sama, maksimal 30 karakter",
                        example: PK-01-01,
                    }

        PutawaySuggestion:
            type: object
            properties:
                line_id: { type: integer, format: int64 }
                item_id: { type: integer, format: int64 }
                qty_remaining: { type: number, format: double }
                locations:
                    type: array
                    items: { $ref: "#/components/schemas/SuggestedLocation" }

        SuggestedLocation:
            type: object
            properties:
                location_id: { type: integer, format: int64 }
                code: { type: string }
                zone: { type: string }
                rack: { type: string }
                level: { type: string }
                loc_type:
                    {
                        type: string,
                        enum:
                            [staging, pick, bulk, quarantine, damaged, transit],
                    }
                free_qty:
                    {
                        type: number,
                        format: double,
                        description: "Sisa kapasitas (0 = tak terbatas / belum diisi kapasitas)",
                    }

        CreateRequestRequest:
            type: object
            description: |
                Aturan validasi (422 ERR_VALIDATION + field details):
                - `warehouse_id` wajib (integer > 0) dan harus warehouse aktif.
                - `lines` wajib berisi minimal 1 baris; per baris — `item_id`
                  dikenal & aktif, `qty` > 0, `uom` terdaftar (kosong = base).
                - `idempotency_key` (bila ada) harus UUIDv4 — atau kirim lewat
                  header `Idempotency-Key` (FSD 4.5).
            required: [warehouse_id, lines]
            properties:
                warehouse_id:
                    {
                        type: integer,
                        format: int64,
                        minimum: 1,
                        description: "Wajib. ID warehouse tujuan (gt=0)",
                    }
                partner_id:
                    {
                        type: integer,
                        format: int64,
                        nullable: true,
                        minimum: 1,
                        description: "Optional. Unit/customer peminta (gt=0)",
                    }
                idempotency_key:
                    {
                        type: string,
                        format: uuid,
                        description: "Optional UUIDv4 — alternatif dari header Idempotency-Key (FSD 4.5)",
                    }
                notes:
                    {
                        type: string,
                        maxLength: 1000,
                        description: "Optional. Maksimal 1000 karakter",
                    }
                lines:
                    type: array
                    minItems: 1
                    description: "Wajib, minimal 1 baris"
                    items: { $ref: "#/components/schemas/RequestLineRequest" }

        RequestLineRequest:
            type: object
            required: [item_id, qty]
            properties:
                item_id:
                    {
                        type: integer,
                        format: int64,
                        minimum: 1,
                        description: "Wajib. ID item master (gt=0); item harus aktif",
                    }
                qty:
                    {
                        type: number,
                        format: double,
                        exclusiveMinimum: 0,
                        description: "Wajib, > 0. Quantity dalam UOM baris",
                    }
                uom:
                    {
                        type: string,
                        maxLength: 20,
                        description: "Optional. Kosong = base UOM item; harus terdaftar di item",
                    }
                notes:
                    {
                        type: string,
                        maxLength: 500,
                        description: "Optional. Maksimal 500 karakter",
                    }

        RequestDocument:
            type: object
            properties:
                id: { type: integer, format: int64 }
                public_id: { type: string, format: uuid }
                doc_no: { type: string, example: "REQ/WH01/2608/00016" }
                doc_type: { type: string, example: REQ }
                doc_date: { type: string, format: date }
                status:
                    {
                        type: string,
                        enum:
                            [
                                draft,
                                submitted,
                                approved,
                                in_progress,
                                completed,
                                cancelled,
                            ],
                    }
                warehouse_id: { type: integer, format: int64 }
                partner_id: { type: integer, format: int64, nullable: true }
                notes: { type: string, nullable: true }
                created_by: { type: integer, format: int64 }
                lines:
                    type: array
                    items: { $ref: "#/components/schemas/RequestLineSummary" }

        RequestLineSummary:
            type: object
            properties:
                id: { type: integer, format: int64 }
                line_no: { type: integer }
                item_id: { type: integer, format: int64 }
                uom: { type: string }
                qty_request: { type: number, format: double }
                qty_processed: { type: number, format: double }

        CreateDeliveryRequest:
            type: object
            description: |
                Aturan validasi (422 ERR_VALIDATION + field details):
                - `request_id` wajib (gt=0) dan harus request (`REQ`) berstatus
                  `approved` dengan minimal 1 line.
                - `warehouse_id` wajib (gt=0) dan harus warehouse aktif.
                - `idempotency_key` (bila ada) harus UUIDv4.
            required: [warehouse_id, request_id]
            properties:
                warehouse_id:
                    {
                        type: integer,
                        format: int64,
                        minimum: 1,
                        description: "Wajib. ID warehouse pengirim (gt=0)",
                    }
                request_id:
                    {
                        type: integer,
                        format: int64,
                        minimum: 1,
                        description: "Wajib. ID request yang sudah disetujui",
                    }
                partner_id:
                    {
                        type: integer,
                        format: int64,
                        nullable: true,
                        minimum: 1,
                        description: "Optional. Customer tujuan (gt=0)",
                    }
                idempotency_key:
                    {
                        type: string,
                        format: uuid,
                        description: "Optional UUIDv4 — alternatif dari header Idempotency-Key (FSD 4.5)",
                    }
                notes:
                    {
                        type: string,
                        maxLength: 1000,
                        description: "Optional. Maksimal 1000 karakter",
                    }

        DeliveryDocument:
            type: object
            properties:
                id: { type: integer, format: int64 }
                public_id: { type: string, format: uuid }
                doc_no: { type: string, example: "DO/WH01/2608/00016" }
                doc_type: { type: string, example: DO }
                doc_date: { type: string, format: date }
                status:
                    {
                        type: string,
                        enum:
                            [
                                draft,
                                submitted,
                                approved,
                                in_progress,
                                completed,
                                cancelled,
                            ],
                    }
                warehouse_id: { type: integer, format: int64 }
                request_id: { type: integer, format: int64, nullable: true }
                partner_id: { type: integer, format: int64, nullable: true }
                notes: { type: string, nullable: true }
                created_by: { type: integer, format: int64 }
                lines:
                    type: array
                    items: { $ref: "#/components/schemas/DeliveryLineSummary" }

        DeliveryLineSummary:
            type: object
            properties:
                id: { type: integer, format: int64 }
                line_no: { type: integer }
                item_id: { type: integer, format: int64 }
                uom: { type: string }
                qty_request: { type: number, format: double }
                qty_processed: { type: number, format: double }

        AllocateRequest:
            type: object
            description: |
                Aturan validasi (422 ERR_VALIDATION + field details):
                - `lines` wajib, minimal 1.
                - Per baris: `line_id` harus milik DO ini; `qty` > 0 dan tidak
                  boleh melebihi sisa line (qty × conv_factor dihitung di
                  backend). Dokumen harus `approved` (409 bila bukan).
            required: [lines]
            properties:
                lines:
                    type: array
                    minItems: 1
                    items: { $ref: "#/components/schemas/AllocateLineRequest" }

        AllocateLineRequest:
            type: object
            required: [line_id, qty]
            properties:
                line_id:
                    {
                        type: integer,
                        format: int64,
                        minimum: 1,
                        description: "Wajib. ID baris DO yang dialokasikan",
                    }
                qty:
                    {
                        type: number,
                        format: double,
                        exclusiveMinimum: 0,
                        description: "Wajib, > 0. Quantity dalam UOM line",
                    }

        OverrideAllocateRequest:
            type: object
            description: |
                Aturan validasi (422 ERR_VALIDATION + field details):
                - `reason_code` wajib (maksimal 30 karakter) — disimpan di
                  `doc.documents.reason_code`.
                - `lines` wajib, minimal 1; per baris `balance_id` wajib dan
                  balance harus available, non-expired, milik warehouse yang
                  sama dan itemnya cocok dengan line.
            required: [reason_code, lines]
            properties:
                reason_code:
                    {
                        type: string,
                        maxLength: 30,
                        description: "Wajib. Alasan override (dicatat, BR-03)",
                    }
                lines:
                    type: array
                    minItems: 1
                    items: { $ref: "#/components/schemas/OverrideLineRequest" }

        OverrideLineRequest:
            type: object
            required: [line_id, qty, balance_id]
            properties:
                line_id:
                    {
                        type: integer,
                        format: int64,
                        minimum: 1,
                        description: "Wajib. ID baris DO",
                    }
                qty:
                    {
                        type: number,
                        format: double,
                        exclusiveMinimum: 0,
                        description: "Wajib, > 0. Quantity dalam UOM line",
                    }
                balance_id:
                    {
                        type: integer,
                        format: int64,
                        minimum: 1,
                        description: "Wajib. Balance spesifik yang dialokasikan manual",
                    }

        AllocationResult:
            type: object
            properties:
                line_id: { type: integer, format: int64 }
                allocation_id: { type: integer, format: int64 }
                balance_id: { type: integer, format: int64 }
                location_code: { type: string }
                batch_id: { type: integer, format: int64, nullable: true }
                qty_allocated: { type: number, format: double }

        PickingListItem:
            type: object
            properties:
                allocation_id: { type: integer, format: int64 }
                line_id: { type: integer, format: int64 }
                item_id: { type: integer, format: int64 }
                sku: { type: string }
                base_uom: { type: string }
                location_code: { type: string }
                pick_seq: { type: integer, nullable: true }
                batch_id: { type: integer, format: int64, nullable: true }
                batch_no: { type: string }
                qty_allocated: { type: number, format: double }
                qty_picked: { type: number, format: double }
                qty_remaining: { type: number, format: double }

        PickRequest:
            type: object
            description: |
                Aturan validasi (422 ERR_VALIDATION + field details):
                - `scans` wajib, minimal 1.
                - Per scan: `allocation_id` harus milik DO ini; `qty` > 0 dan
                  ≤ sisa alokasi; barcode item & lokasi harus cocok dengan
                  alokasi (jika tidak 409 ERR_SCAN_MISMATCH).
            required: [scans]
            properties:
                scans:
                    type: array
                    minItems: 1
                    items: { $ref: "#/components/schemas/PickScanRequest" }

        PickScanRequest:
            type: object
            required: [allocation_id, location_barcode, item_barcode, qty]
            properties:
                allocation_id:
                    {
                        type: integer,
                        format: int64,
                        minimum: 1,
                        description: "Wajib. ID alokasi yang di-pick",
                    }
                location_barcode:
                    {
                        type: string,
                        maxLength: 30,
                        description: "Wajib. Barcode/kode bin tujuan",
                    }
                item_barcode:
                    {
                        type: string,
                        maxLength: 64,
                        description: "Wajib. Barcode item yang discan",
                    }
                qty:
                    {
                        type: number,
                        format: double,
                        exclusiveMinimum: 0,
                        description: "Wajib, > 0. Quantity yang di-pick",
                    }

        ShipRequest:
            type: object
            properties:
                vehicle_no:
                    {
                        type: string,
                        maxLength: 20,
                        description: "Optional. Nomor kendaraan (surat jalan)",
                    }
                driver_name:
                    {
                        type: string,
                        maxLength: 100,
                        description: "Optional. Nama sopir/kurir",
                    }

        PodRequest:
            type: object
            description: |
                Aturan validasi (422 ERR_VALIDATION + field details):
                - `received_by` wajib (maksimal 100 karakter).
                - `received_at` optional, format RFC3339 bila diisi.
                - `pod_file_url` / `signature_url` optional (URL berkas foto /
                  tanda tangan, diunggah klien terlebih dahulu).
            required: [received_by]
            properties:
                received_by:
                    {
                        type: string,
                        maxLength: 100,
                        description: "Wajib. Nama penerima barang",
                    }
                received_at:
                    {
                        type: string,
                        format: date-time,
                        description: "Optional. Waktu kedatangan/serah terima (RFC3339)",
                    }
                pod_file_url:
                    {
                        type: string,
                        maxLength: 1000,
                        description: "Optional. URL bukti serah terima (foto)",
                    }
                signature_url:
                    {
                        type: string,
                        maxLength: 1000,
                        description: "Optional. URL tanda tangan",
                    }

        OutboundStatus:
            type: object
            properties:
                id: { type: integer, format: int64 }
                status:
                    {
                        type: string,
                        description: "Status dokumen setelah aksi",
                        example: approved,
                    }

        # ═══════════════ Fase 8 (M5 Transfer & M6 Stock Opname) ═══════════════

        TransferLineRequest:
            type: object
            required: [item_id, qty]
            properties:
                item_id: { type: integer, format: int64, example: 1 }
                qty: { type: number, format: double, example: 10 }
                uom:
                    {
                        type: string,
                        maxLength: 20,
                        description: "Kosong = satuan dasar item",
                        example: BOX,
                    }
                notes: { type: string, maxLength: 500 }

        TransferCreateRequest:
            type: object
            description: |
                Validasi (422): `lines` minimal 1; `qty > 0`; UoM terdaftar;
                gudang asal ≠ tujuan; keduanya aktif.
            required: [warehouse_id, dest_warehouse_id, lines]
            properties:
                warehouse_id: { type: integer, format: int64, example: 1 }
                dest_warehouse_id: { type: integer, format: int64, example: 2 }
                idempotency_key:
                    {
                        type: string,
                        format: uuid,
                        description: "Opsional. Idempotensi (FSD 4.5)",
                    }
                notes: { type: string, maxLength: 1000 }
                lines:
                    type: array
                    items: { $ref: "#/components/schemas/TransferLineRequest" }

        TransferLineSummary:
            type: object
            properties:
                id: { type: integer, format: int64 }
                line_no: { type: integer }
                item_id: { type: integer, format: int64 }
                uom: { type: string }
                qty_request: { type: number, format: double }
                qty_processed: { type: number, format: double }

        TransferDocumentResponse:
            type: object
            properties:
                id: { type: integer, format: int64 }
                public_id: { type: string, format: uuid }
                doc_no: { type: string, example: TRF/WH01/2608/00001 }
                doc_type: { type: string, example: TRF }
                doc_date: { type: string, format: date }
                status: { type: string, example: draft }
                warehouse_id: { type: integer, format: int64 }
                dest_warehouse_id: { type: integer, format: int64 }
                notes: { type: string }
                created_by: { type: integer, format: int64 }
                lines:
                    type: array
                    items: { $ref: "#/components/schemas/TransferLineSummary" }

        TransferReceiveLineRequest:
            type: object
            required: [line_id, qty_received, location_id]
            properties:
                line_id: { type: integer, format: int64 }
                qty_received: { type: number, format: double, example: 100 }
                location_id:
                    {
                        type: integer,
                        format: int64,
                        description: "Bin tujuan di gudang tujuan (pick/bulk/staging)",
                    }
                batch_id:
                    {
                        type: integer,
                        format: int64,
                        description: "Wajib untuk item batch-managed",
                    }
                notes: { type: string, maxLength: 500 }

        TransferReceiveRequest:
            type: object
            required: [lines]
            properties:
                lines:
                    type: array
                    items:
                        {
                            $ref: "#/components/schemas/TransferReceiveLineRequest",
                        }

        TransferReceiptSummary:
            type: object
            properties:
                id: { type: integer, format: int64 }
                line_id: { type: integer, format: int64 }
                qty_sent: { type: number, format: double }
                qty_received: { type: number, format: double }
                variance: { type: number, format: double }
                received_by: { type: integer, format: int64 }

        TransferStatusResponse:
            type: object
            properties:
                id: { type: integer, format: int64 }
                status: { type: string, example: in_progress }
                receipts:
                    type: array
                    items:
                        { $ref: "#/components/schemas/TransferReceiptSummary" }
                discrepancy:
                    {
                        type: boolean,
                        description: "true bila ada selisih (barang kurang dari kiriman)",
                    }

        CountCreateRequest:
            type: object
            required: [warehouse_id]
            properties:
                warehouse_id: { type: integer, format: int64 }
                zone:
                    {
                        type: string,
                        maxLength: 20,
                        description: "Opsional. Batasi snapshot per zona lokasi",
                    }
                item_ids:
                    type: array
                    items: { type: integer, format: int64 }
                    description: "Opsional. Batasi snapshot per item"
                idempotency_key:
                    {
                        type: string,
                        format: uuid,
                        description: "Opsional. Idempotensi (FSD 4.5)",
                    }
                notes: { type: string, maxLength: 1000 }

        CountLineSummary:
            type: object
            description: |
                Blind Count (FR-6.1): `qty_system` sengaja TIDAK dikembalikan
                ke petugas penghitung. `variance` muncul setelah input.
            properties:
                id: { type: integer, format: int64 }
                item_id: { type: integer, format: int64 }
                location_id: { type: integer, format: int64 }
                batch_id: { type: integer, format: int64 }
                qty_counted: { type: number, format: double }
                variance: { type: number, format: double }
                reason_code: { type: string }

        CountDocumentResponse:
            type: object
            properties:
                id: { type: integer, format: int64 }
                public_id: { type: string, format: uuid }
                doc_no: { type: string, example: CNT/WH01/2608/00001 }
                doc_type: { type: string, example: CNT }
                doc_date: { type: string, format: date }
                status: { type: string, example: draft }
                warehouse_id: { type: integer, format: int64 }
                notes: { type: string }
                created_by: { type: integer, format: int64 }
                lines:
                    type: array
                    items: { $ref: "#/components/schemas/CountLineSummary" }

        CountLineDetail:
            type: object
            description: |
                Satu baris `doc.count_lines` untuk tampilan reconciliation
                (supervisor/manager). Berbeda dari `CountLineSummary`, di sini
                `qty_system` DIKEMBALIKAN — view ini untuk supervisor, bukan
                petugas penghitung (Blind Count FR-6.1 tetap berlaku).
            properties:
                id: { type: integer, format: int64 }
                item_id: { type: integer, format: int64 }
                sku: { type: string }
                item_name: { type: string }
                uom: { type: string }
                location_id: { type: integer, format: int64 }
                location_code: { type: string }
                batch_id: { type: integer, format: int64, nullable: true }
                batch_no: { type: string }
                expiry_date: { type: string, format: date }
                qty_system:
                    {
                        type: number,
                        format: double,
                        nullable: true,
                        description: "null / absent saat blind=1 (Blind Count FR-6.1)",
                    }
                qty_counted: { type: number, format: double, nullable: true }
                variance: { type: number, format: double, nullable: true }
                reason_code: { type: string }
                counted_by: { type: integer, format: int64, nullable: true }
                counted_at: { type: string, format: date-time, nullable: true }

        CountDocumentDetail:
            type: object
            description: |
                Header sesi opname `CNT` beserta baris snapshot/hasil untuk
                halaman reconciliation supervisor (GET /counts/{id}).
            properties:
                id: { type: integer, format: int64 }
                public_id: { type: string, format: uuid }
                doc_no: { type: string, example: CNT/WH01/2608/00001 }
                doc_type: { type: string, example: CNT }
                doc_date: { type: string, format: date }
                status: { type: string, example: draft }
                warehouse_id: { type: integer, format: int64 }
                notes: { type: string }
                created_at: { type: string, format: date-time }
                created_by: { type: integer, format: int64 }
                warehouse_code: { type: string }
                warehouse_name: { type: string }
                lines:
                    type: array
                    items: { $ref: "#/components/schemas/CountLineDetail" }

        InputCountLineRequest:
            type: object
            required: [count_line_id, qty_counted]
            properties:
                count_line_id: { type: integer, format: int64 }
                qty_counted: { type: number, format: double, minimum: 0 }
                reason_code: { type: string, maxLength: 30 }

        InputCountLinesRequest:
            type: object
            required: [lines]
            properties:
                lines:
                    type: array
                    items:
                        { $ref: "#/components/schemas/InputCountLineRequest" }

        PostCountRequest:
            type: object
            description: |
                `manager_approver_id` wajib bila total nilai variance melebihi
                ambang persetujuan berjenjang (M6.4, default Rp 5.000.000).
            properties:
                manager_approver_id:
                    {
                        type: integer,
                        format: int64,
                        description: "Inventory Manager (berbeda dari pembuat dan penyetuju)",
                    }

        PostCountResponse:
            type: object
            properties:
                id: { type: integer, format: int64 }
                status: { type: string, example: completed }
                total_variance: { type: number, format: double }
                total_variance_value: { type: number, format: double }
                needs_manager_approval: { type: boolean }
                posted_adjustment_lines: { type: integer }

        AdjustmentLineRequest:
            type: object
            required: [item_id, location_id, qty]
            properties:
                item_id: { type: integer, format: int64 }
                location_id: { type: integer, format: int64 }
                batch_id: { type: integer, format: int64 }
                qty:
                    {
                        type: number,
                        format: double,
                        description: "Bertanda: (+) menambah saldo, (-) mengurangi saldo",
                        example: -10,
                    }
                status:
                    {
                        type: string,
                        enum: [available, damaged, quarantine],
                        description: "Default: available",
                    }
                reason_code: { type: string, maxLength: 30 }

        AdjustmentCreateRequest:
            type: object
            description: |
                Penyesuaian manual (FR-6.5): `reason_code` dan `notes` wajib.
            required: [warehouse_id, reason_code, notes, lines]
            properties:
                warehouse_id: { type: integer, format: int64 }
                reason_code: { type: string, maxLength: 30, example: RUSAK }
                notes:
                    {
                        type: string,
                        maxLength: 1000,
                        description: "Penjelasan tertulis wajib",
                    }
                idempotency_key:
                    {
                        type: string,
                        format: uuid,
                        description: "Opsional. Idempotensi (FSD 4.5)",
                    }
                lines:
                    type: array
                    items:
                        { $ref: "#/components/schemas/AdjustmentLineRequest" }

        AdjustmentDocumentResponse:
            type: object
