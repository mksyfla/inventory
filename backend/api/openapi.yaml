openapi: 3.1.0
info:
    title: SIMBAR - Sistem Manajemen Inventori
    version: 0.2.0
    description: |
        API contract for Sistem Manajemen Inventori (SIMBAR) per FSD v0.1.

        - Base path: `/api/v1`, JSON, `Content-Type: application/json`.
        - Protected endpoints require `Authorization: Bearer <access-token>` (JWT, 15 min)
          and the `X-Warehouse-Id` header with a warehouse code the user is assigned to.
        - Every response uses the `ApiResponse` envelope; errors carry a machine-readable
          `code` (see FSD §5.4) plus optional per-field `details`.
        - All client input failures return `422 ERR_VALIDATION` with field details.
        - `POST /auth/login` is rate limited to 5 attempts / 15 min per IP; `POST /auth/register` to 10 / 15 min.

servers:
    - url: /api/v1
      description: Same origin (behind reverse proxy)

tags:
    - name: System
    - name: Auth
    - name: Items
    - name: Locations
    - name: Partners
    - name: Stock
    - name: API Docs

security:
    - bearerAuth: []
    - cookieAuth: []

paths:
    /ping:
        get:
            tags: [System]
            summary: Health ping
            security: []
            responses:
                "200":
                    description: pong
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/ApiResponse" }

    /auth/login:
        post:
            tags: [Auth]
            summary: Login and issue access + refresh tokens
            description: |
                Sets HttpOnly cookies on success: `access_token` (path `/`, 15 min) and
                `refresh_token` (path `/api/v1/auth`, 7 days), SameSite=Lax, Secure over TLS.
                The tokens are also returned in the JSON body for non-browser clients.
            security: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema: { $ref: "#/components/schemas/LoginRequest" }
            responses:
                "200":
                    description: Token pair issued (also as Set-Cookie headers)
                    headers:
                        Set-Cookie:
                            description: "HttpOnly auth cookies (access_token, refresh_token)"
                            schema: { type: string }
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - {
                                          $ref: "#/components/schemas/ApiResponse",
                                      }
                                    - type: object
                                      properties:
                                          data:
                                              {
                                                  $ref: "#/components/schemas/TokenPair",
                                              }
                "401":
                    $ref: "#/components/responses/Error"
                "422":
                    $ref: "#/components/responses/ValidationError"
                "429":
                    $ref: "#/components/responses/RateLimited"

    /auth/register:
        post:
            tags: [Auth]
            summary: Register a new user (Argon2id password, min 12 chars)
            security: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema: { $ref: "#/components/schemas/RegisterRequest" }
            responses:
                "201":
                    description: User created
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - {
                                          $ref: "#/components/schemas/ApiResponse",
                                      }
                                    - type: object
                                      properties:
                                          data:
                                              {
                                                  $ref: "#/components/schemas/RegisterResponse",
                                              }
                "409":
                    $ref: "#/components/responses/Error"
                "422":
                    $ref: "#/components/responses/ValidationError"
                "429":
                    $ref: "#/components/responses/RateLimited"

    /auth/refresh:
        post:
            tags: [Auth]
            summary: Rotate refresh token and issue a new pair
            security: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema: { $ref: "#/components/schemas/RefreshRequest" }
            responses:
                "200":
                    description: New token pair issued (old refresh token revoked)
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - {
                                          $ref: "#/components/schemas/ApiResponse",
                                      }
                                    - type: object
                                      properties:
                                          data:
                                              {
                                                  $ref: "#/components/schemas/TokenPair",
                                              }
                "401":
                    $ref: "#/components/responses/Error"
                "422":
                    $ref: "#/components/responses/ValidationError"

    /auth/logout:
        post:
            tags: [Auth]
            summary: Revoke the refresh token
            security: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema: { $ref: "#/components/schemas/RefreshRequest" }
            responses:
                "200":
                    description: Logged out (idempotent)
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/ApiResponse" }
                "422":
                    $ref: "#/components/responses/ValidationError"

    /items:
        get:
            tags: [Items]
            summary: List all items
            description: Requires `item.read`.
            parameters: [{ $ref: "#/components/parameters/XWarehouseId" }]
            responses:
                "200":
                    description: Item list
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - {
                                          $ref: "#/components/schemas/ApiResponse",
                                      }
                                    - type: object
                                      properties:
                                          data:
                                              type: array
                                              items:
                                                  {
                                                      $ref: "#/components/schemas/Item",
                                                  }
                "401": { $ref: "#/components/responses/Error" }
                "403": { $ref: "#/components/responses/Error" }
        post:
            tags: [Items]
            summary: Create an item
            description: Requires `item.write`. Body limited to 1 MB.
            parameters: [{ $ref: "#/components/parameters/XWarehouseId" }]
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            { $ref: "#/components/schemas/CreateItemRequest" }
            responses:
                "201":
                    description: Item created
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - {
                                          $ref: "#/components/schemas/ApiResponse",
                                      }
                                    - type: object
                                      properties:
                                          data:
                                              {
                                                  $ref: "#/components/schemas/ItemDetail",
                                              }
                "401": { $ref: "#/components/responses/Error" }
                "403": { $ref: "#/components/responses/Error" }
                "409": { $ref: "#/components/responses/Error" }
                "422": { $ref: "#/components/responses/ValidationError" }

    /items/import:
        post:
            tags: [Items]
            summary: Import items from CSV (async)
            description: |
                Requires `item.import`. Multipart upload (10 MB max) with field `file`
                containing a CSV whose header must include `sku`, `name`, `base_uom`.
                Returns 202 with a `job_id` immediately.

                Validasi (422 ERR_VALIDATION): field `file` wajib ada; file harus
                bisa dibaca sebagai CSV; header wajib memuat kolom `sku`, `name`,
                `base_uom` — kolom lain diabaikan. Ukuran > 10 MB -> 413.
            parameters: [{ $ref: "#/components/parameters/XWarehouseId" }]
            requestBody:
                required: true
                content:
                    multipart/form-data:
                        schema:
                            type: object
                            required: [file]
                            properties:
                                file: { type: string, format: binary }
            responses:
                "202":
                    description: Import job queued
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - {
                                          $ref: "#/components/schemas/ApiResponse",
                                      }
                                    - type: object
                                      properties:
                                          data:
                                              {
                                                  $ref: "#/components/schemas/ImportJobResponse",
                                              }
                "401": { $ref: "#/components/responses/Error" }
                "403": { $ref: "#/components/responses/Error" }
                "413": { $ref: "#/components/responses/Error" }
                "422": { $ref: "#/components/responses/ValidationError" }

    /items/{id}:
        get:
            tags: [Items]
            summary: Get item by ID with its UoMs
            description: Requires `item.read`.
            parameters:
                - { $ref: "#/components/parameters/XWarehouseId" }
                - { $ref: "#/components/parameters/ItemID" }
            responses:
                "200":
                    description: Item with UoMs
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - {
                                          $ref: "#/components/schemas/ApiResponse",
                                      }
                                    - type: object
                                      properties:
                                          data:
                                              type: object
                                              properties:
                                                  item:
                                                      {
                                                          $ref: "#/components/schemas/ItemDetail",
                                                      }
                                                  uoms:
                                                      type: array
                                                      items:
                                                          {
                                                              $ref: "#/components/schemas/ItemUoM",
                                                          }
                "401": { $ref: "#/components/responses/Error" }
                "403": { $ref: "#/components/responses/Error" }
                "404": { $ref: "#/components/responses/Error" }
                "422": { $ref: "#/components/responses/ValidationError" }
        put:
            tags: [Items]
            summary: Update an item
            description: Requires `item.write`. Body limited to 1 MB.
            parameters:
                - { $ref: "#/components/parameters/XWarehouseId" }
                - { $ref: "#/components/parameters/ItemID" }
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            { $ref: "#/components/schemas/UpdateItemRequest" }
            responses:
                "200":
                    description: Item updated
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - {
                                          $ref: "#/components/schemas/ApiResponse",
                                      }
                                    - type: object
                                      properties:
                                          data:
                                              {
                                                  $ref: "#/components/schemas/ItemDetail",
                                              }
                "401": { $ref: "#/components/responses/Error" }
                "403": { $ref: "#/components/responses/Error" }
                "404": { $ref: "#/components/responses/Error" }
                "422": { $ref: "#/components/responses/ValidationError" }
        delete:
            tags: [Items]
            summary: Soft-delete an item (set is_active=false)
            description: Requires `item.write`.
            parameters:
                - { $ref: "#/components/parameters/XWarehouseId" }
                - { $ref: "#/components/parameters/ItemID" }
            responses:
                "200":
                    description: Item deactivated
                    content:
                        application/json:
                            schema: { $ref: "#/components/schemas/ApiResponse" }
                "401": { $ref: "#/components/responses/Error" }
                "403": { $ref: "#/components/responses/Error" }
                "422": { $ref: "#/components/responses/ValidationError" }

    /locations:
        get:
            tags: [Locations]
            summary: List locations of a warehouse
            description: Requires `location.read`.
            parameters:
                - { $ref: "#/components/parameters/XWarehouseId" }
                - name: warehouse_id
                  in: query
                  required: true
                  description: "Wajib, bilangan bulat positif (422 bila kosong/bukan angka)"
                  schema: { type: integer, format: int64, minimum: 1 }
            responses:
                "200":
                    description: Location list
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - {
                                          $ref: "#/components/schemas/ApiResponse",
                                      }
                                    - type: object
                                      properties:
                                          data:
                                              type: array
                                              items:
                                                  {
                                                      $ref: "#/components/schemas/Location",
                                                  }
                "401": { $ref: "#/components/responses/Error" }
                "403": { $ref: "#/components/responses/Error" }
                "422": { $ref: "#/components/responses/ValidationError" }
        post:
            tags: [Locations]
            summary: Create a location bin
            description: Requires `location.write`. Body limited to 1 MB.
            parameters: [{ $ref: "#/components/parameters/XWarehouseId" }]
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            {
                                $ref: "#/components/schemas/CreateLocationRequest",
                            }
            responses:
                "201":
                    description: Location created
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - {
                                          $ref: "#/components/schemas/ApiResponse",
                                      }
                                    - type: object
                                      properties:
                                          data:
                                              {
                                                  $ref: "#/components/schemas/Location",
                                              }
                "401": { $ref: "#/components/responses/Error" }
                "403": { $ref: "#/components/responses/Error" }
                "409": { $ref: "#/components/responses/Error" }
                "422": { $ref: "#/components/responses/ValidationError" }

    /partners:
        get:
            tags: [Partners]
            summary: List all partners
            description: Requires `partner.read`.
            parameters: [{ $ref: "#/components/parameters/XWarehouseId" }]
            responses:
                "200":
                    description: Partner list
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - {
                                          $ref: "#/components/schemas/ApiResponse",
                                      }
                                    - type: object
                                      properties:
                                          data:
                                              type: array
                                              items:
                                                  {
                                                      $ref: "#/components/schemas/Partner",
                                                  }
                "401": { $ref: "#/components/responses/Error" }
                "403": { $ref: "#/components/responses/Error" }
        post:
            tags: [Partners]
            summary: Create a partner
            description: Requires `partner.write`. Body limited to 1 MB. Contact name/phone are encrypted at rest.
            parameters: [{ $ref: "#/components/parameters/XWarehouseId" }]
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            {
                                $ref: "#/components/schemas/CreatePartnerRequest",
                            }
            responses:
                "201":
                    description: Partner created
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - {
                                          $ref: "#/components/schemas/ApiResponse",
                                      }
                                    - type: object
                                      properties:
                                          data:
                                              {
                                                  $ref: "#/components/schemas/Partner",
                                              }
                "401": { $ref: "#/components/responses/Error" }
                "403": { $ref: "#/components/responses/Error" }
                "409": { $ref: "#/components/responses/Error" }
                "422": { $ref: "#/components/responses/ValidationError" }

    /partners/{id}:
        get:
            tags: [Partners]
            summary: Get partner by ID
            description: Requires `partner.read`.
            parameters:
                - { $ref: "#/components/parameters/XWarehouseId" }
                - name: id
                  in: path
                  required: true
                  schema: { type: integer, format: int64, minimum: 1 }
            responses:
                "200":
                    description: Partner
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - {
                                          $ref: "#/components/schemas/ApiResponse",
                                      }
                                    - type: object
                                      properties:
                                          data:
                                              {
                                                  $ref: "#/components/schemas/Partner",
                                              }
                "401": { $ref: "#/components/responses/Error" }
                "403": { $ref: "#/components/responses/Error" }
                "404": { $ref: "#/components/responses/Error" }
                "422": { $ref: "#/components/responses/ValidationError" }

    /stock/movements:
        get:
            tags: [Stock]
            summary: Stock movements ledger (keyset pagination)
            description: |
                Requires `stock.read`. Date range is mandatory (partition pruning).
                Pagination is keyset-based via `cursor` / `next_cursor`.
            parameters:
                - { $ref: "#/components/parameters/XWarehouseId" }
                - name: start_time
                  in: query
                  required: true
                  description: RFC3339 timestamp (inclusive)
                  schema: { type: string, format: date-time }
                - name: end_time
                  in: query
                  required: true
                  description: "RFC3339 timestamp (inclusive), must be >= start_time"
                  schema: { type: string, format: date-time }
                - name: item_id
                  in: query
                  required: false
                  description: Optional item filter
                  schema: { type: integer, format: int64, minimum: 1 }
                - name: limit
                  in: query
                  required: false
                  description: "Page size, 1-100, default 50"
                  schema:
                      { type: integer, minimum: 1, maximum: 100, default: 50 }
                - name: cursor
                  in: query
                  required: false
                  description: Opaque keyset cursor from previous `next_cursor`
                  schema: { type: string }
            responses:
                "200":
                    description: Movements page
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - {
                                          $ref: "#/components/schemas/ApiResponse",
                                      }
                                    - type: object
                                      properties:
                                          data:
                                              {
                                                  $ref: "#/components/schemas/StockMovementList",
                                              }
                "401": { $ref: "#/components/responses/Error" }
                "403": { $ref: "#/components/responses/Error" }
                "422": { $ref: "#/components/responses/ValidationError" }

    /receipts:
        post:
            tags: [Inbound M2]
            summary: Create a GRN draft (Fase 6.1, FR-2.1)
            description: |
                Membuka draft penerimaan barang (GRN): header + lines divalidasi
                terhadap master data, batch di-resolve/dibuat, dan nomor dokumen
                `GRN/{WAREHOUSE}/{YYMM}/{SEQ:5}` dialokasikan — semuanya dalam satu
                transaksi (FSD 4.3).

                Requires `grn.create`. Body limited to 1 MB.

                Idempotensi (FSD 4.5): kirim `Idempotency-Key` (UUIDv4) — kunci
                berulang mengembalikan dokumen yang sudah ada tanpa duplikat
                (dalam mode idempotensi penuh: 200 dengan dokumen asli).

                Validasi (422 ERR_VALIDATION + field details): `warehouse_id`
                wajib & aktif; `lines` minimal 1; per baris — `item_id` dikenal &
                aktif, `qty` > 0, `uom` terdaftar di item, `batch_no` wajib untuk
                item batch-managed (dilarang untuk non-batch), `expiry_date`
                wajib untuk item expiry-managed (format YYYY-MM-DD), `status`
                salah satu available/quarantine/damaged; `Idempotency-Key` /
                `idempotency_key` harus UUIDv4.
            security:
                - bearerAuth: []
            parameters:
                - { $ref: "#/components/parameters/XWarehouseId" }
                - { $ref: "#/components/parameters/IdempotencyKey" }
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            {
                                $ref: "#/components/schemas/CreateReceiptRequest",
                            }
            responses:
                "201":
                    description: GRN draft created (or existing document replayed for the same idempotency key)
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - {
                                          $ref: "#/components/schemas/ApiResponse",
                                      }
                                    - type: object
                                      properties:
                                          data:
                                              {
                                                  $ref: "#/components/schemas/ReceiptDocument",
                                              }
                "401": { $ref: "#/components/responses/Error" }
                "403": { $ref: "#/components/responses/Error" }
                "422": { $ref: "#/components/responses/ValidationError" }

    /receipts/{id}/submit:
        post:
            tags: [Inbound M2]
            summary: Submit a GRN draft for approval (Fase 6.1, FSD 4.4)
            description: |
                Transisi `draft → submitted`. Requires `grn.approve` (FSD endpoint
                table memetakan submit dan approve ke `grn.approve`).

                Validasi (422): path `:id` harus bilangan bulat positif;
                dokumen harus berstatus `draft` (selain itu 409 ERR_INVALID_STATE);
                dokumen tidak ditemukan -> 404.
            security:
                - bearerAuth: []
            parameters:
                - { $ref: "#/components/parameters/XWarehouseId" }
                - { $ref: "#/components/parameters/ItemID" }
            responses:
                "200":
                    description: Submitted
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - {
                                          $ref: "#/components/schemas/ApiResponse",
                                      }
                                    - type: object
                                      properties:
                                          data:
                                              {
                                                  $ref: "#/components/schemas/ReceiptStatus",
                                              }
                "401": { $ref: "#/components/responses/Error" }
                "403": { $ref: "#/components/responses/Error" }
                "404": { $ref: "#/components/responses/Error" }
                "409": { $ref: "#/components/responses/Error" }
                "422": { $ref: "#/components/responses/ValidationError" }

    /receipts/{id}/approve:
        post:
            tags: [Inbound M2]
            summary: Approve a GRN and post stock to staging (Fase 6.2, BR-05)
            description: |
                Transisi `submitted → approved` dengan maker-checker:
                approver harus berbeda dari creator (ERR_SELF_APPROVAL, 403).
                Satu movement `receipt` per line (qty × conv_factor ke base UOM)
                diposting ke lokasi `staging` warehouse — posting mengikuti pola
                FSD 4.1: all-or-nothing dalam satu transaksi dengan dokumen status.
                Requires `grn.approve`.

                Validasi (422/403/409): path `:id` bilangan bulat positif;
                dokumen harus `submitted` (409 bila bukan); maker-checker —
                approver harus berbeda dari creator (403 ERR_SELF_APPROVAL);
                lokasi staging harus terkonfigurasi untuk warehouse (404);
                stok tidak cukup saat posting -> 409 ERR_STOCK_INSUFFICIENT.
            security:
                - bearerAuth: []
            parameters:
                - { $ref: "#/components/parameters/XWarehouseId" }
                - { $ref: "#/components/parameters/ItemID" }
            responses:
                "200":
                    description: Approved and posted to staging
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - {
                                          $ref: "#/components/schemas/ApiResponse",
                                      }
                                    - type: object
                                      properties:
                                          data:
                                              {
                                                  $ref: "#/components/schemas/ReceiptStatus",
                                              }
                "401": { $ref: "#/components/responses/Error" }
                "403": { $ref: "#/components/responses/Error" }
                "404": { $ref: "#/components/responses/Error" }
                "409": { $ref: "#/components/responses/Error" }
                "422": { $ref: "#/components/responses/ValidationError" }

    /receipts/{id}/putaway-suggestion:
        get:
            tags: [Inbound M2]
            summary: Putaway suggestion per line (Fase 6.3, FR-2.5)
            description: |
                Menilai lokasi pick/bulk warehouse untuk setiap line yang masih
                menunggu putaway (FR-2.5, FSD 4.2): item kelas-A mengutamakan
                pick face, `pick_seq` memutus urutan, dan lokasi yang tidak muat
                (kapasitas) dikecualikan. Hanya berlaku pada dokumen
                `approved`/`in_progress`. Requires `grn.putaway`.

                Validasi (422/409): path `:id` bilangan bulat positif; status
                dokumen harus `approved`/`in_progress` (409); dokumen tidak
                ditemukan -> 404. Line yang sudah penuh (qty_processed =
                qty_request) tidak ikut disarankan.
            security:
                - bearerAuth: []
            parameters:
                - { $ref: "#/components/parameters/XWarehouseId" }
                - { $ref: "#/components/parameters/ItemID" }
            responses:
                "200":
                    description: Suggestion list (empty when nothing left to store)
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - {
                                          $ref: "#/components/schemas/ApiResponse",
                                      }
                                    - type: object
                                      properties:
                                          data:
                                              type: array
                                              items:
                                                  {
                                                      $ref: "#/components/schemas/PutawaySuggestion",
                                                  }
                "401": { $ref: "#/components/responses/Error" }
                "403": { $ref: "#/components/responses/Error" }
                "404": { $ref: "#/components/responses/Error" }
                "409": { $ref: "#/components/responses/Error" }
                "422": { $ref: "#/components/responses/ValidationError" }

    /receipts/{id}/putaway:
        post:
            tags: [Inbound M2]
            summary: Execute putaway from staging to target bins (Fase 6.4, FR-2.5)
            description: |
                Per scan dibuat dua movement `internal_move` (staging −qty, target
                +qty) dan `qty_processed` line bertambah. Status dokumen maju
                `approved → in_progress → completed` begitu semua line tersimpan
                penuh (FSD 4.4). Validasi scan (line milik dokumen, qty ≤ sisa,
                lokasi ada) dilakukan sebelum transaksi — all-or-nothing.
                Requires `grn.putaway`.

                Validasi (422/409): `lines` minimal 1 scan; per scan — `line_id`
                harus milik dokumen ini, `qty` > 0 dan ≤ sisa qty line,
                `location_code` harus ada di warehouse yang sama (422);
                status dokumen harus `approved`/`in_progress` (409); stok staging
                tidak cukup -> 409 ERR_STOCK_INSUFFICIENT.
            security:
                - bearerAuth: []
            parameters:
                - { $ref: "#/components/parameters/XWarehouseId" }
                - { $ref: "#/components/parameters/ItemID" }
            requestBody:
                required: true
                content:
                    application/json:
                        schema: { $ref: "#/components/schemas/PutawayRequest" }
            responses:
                "200":
                    description: Putaway executed; status after the scans
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - {
                                          $ref: "#/components/schemas/ApiResponse",
                                      }
                                    - type: object
                                      properties:
                                          data:
                                              {
                                                  $ref: "#/components/schemas/ReceiptStatus",
                                              }
                "401": { $ref: "#/components/responses/Error" }
                "403": { $ref: "#/components/responses/Error" }
                "404": { $ref: "#/components/responses/Error" }
                "409": { $ref: "#/components/responses/Error" }
                "422": { $ref: "#/components/responses/ValidationError" }

    /requests:
        post:
            tags: [Outbound M4]
            summary: Create a request (REQ) draft (Fase 7.1, FR-4.1)
            description: |
                Membuka draft permintaan barang dari unit internal/customer:
                header + lines divalidasi terhadap master data dan nomor
                dokumen `REQ/{WAREHOUSE}/{YYMM}/{SEQ:5}` dialokasikan dalam satu
                transaksi (FSD 4.3). Idempotensi via `Idempotency-Key` (FSD 4.5).
                Requires `request.create`.

                Validasi (422): `warehouse_id` wajib & aktif; `lines` minimal 1;
                per baris — `item_id` dikenal & aktif, `qty` > 0, `uom` terdaftar.
            security:
                - bearerAuth: []
            parameters:
                - { $ref: "#/components/parameters/XWarehouseId" }
                - { $ref: "#/components/parameters/IdempotencyKey" }
            requestBody:
                required: true
                content:
                    application/json:
                        schema: { $ref: "#/components/schemas/CreateRequestRequest" }
            responses:
                "201":
                    description: Request draft created (or replayed for the same idempotency key)
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - { $ref: "#/components/schemas/ApiResponse" }
                                    - type: object
                                      properties:
                                          data:
                                              {
                                                  $ref: "#/components/schemas/RequestDocument",
                                              }
                "401": { $ref: "#/components/responses/Error" }
                "403": { $ref: "#/components/responses/Error" }
                "422": { $ref: "#/components/responses/ValidationError" }

    /requests/{id}/submit:
        post:
            tags: [Outbound M4]
            summary: Submit a request for approval (Fase 7.1, FSD 4.4)
            description: |
                Transisi `draft → submitted`. Requires `request.approve`.
                Dokumen harus berstatus `draft` (selain itu 409 ERR_INVALID_STATE).
            security:
                - bearerAuth: []
            parameters:
                - { $ref: "#/components/parameters/XWarehouseId" }
                - { $ref: "#/components/parameters/ItemID" }
            responses:
                "200":
                    description: Submitted
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - { $ref: "#/components/schemas/ApiResponse" }
                                    - type: object
                                      properties:
                                          data:
                                              {
                                                  $ref: "#/components/schemas/OutboundStatus",
                                              }
                "401": { $ref: "#/components/responses/Error" }
                "403": { $ref: "#/components/responses/Error" }
                "404": { $ref: "#/components/responses/Error" }
                "409": { $ref: "#/components/responses/Error" }
                "422": { $ref: "#/components/responses/ValidationError" }

    /requests/{id}/approve:
        post:
            tags: [Outbound M4]
            summary: Approve a request (Fase 7.1, BR-05)
            description: |
                Transisi `submitted → approved` dengan maker-checker:
                approver harus berbeda dari creator (ERR_SELF_APPROVAL, 403).
                DO hanya bisa dibuat dari request berstatus `approved`.
                Requires `request.approve`.
            security:
                - bearerAuth: []
            parameters:
                - { $ref: "#/components/parameters/XWarehouseId" }
                - { $ref: "#/components/parameters/ItemID" }
            responses:
                "200":
                    description: Approved
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - { $ref: "#/components/schemas/ApiResponse" }
                                    - type: object
                                      properties:
                                          data:
                                              {
                                                  $ref: "#/components/schemas/OutboundStatus",
                                              }
                "401": { $ref: "#/components/responses/Error" }
                "403": { $ref: "#/components/responses/Error" }
                "404": { $ref: "#/components/responses/Error" }
                "409": { $ref: "#/components/responses/Error" }
                "422": { $ref: "#/components/responses/ValidationError" }

    /deliveries:
        post:
            tags: [Outbound M4]
            summary: Create a delivery order (DO) from an approved request (Fase 7.1, FR-4.1)
            description: |
                Membuat dokumen DO/Surat Jalan dari permintaan yang sudah
                disetujui: lines disalin dari request, `ref_doc_id` menunjuk
                request, nomor `DO/{WAREHOUSE}/{YYMM}/{SEQ:5}` dialokasikan
                dalam satu transaksi. Idempotensi via `Idempotency-Key`.
                Requires `do.create`.

                Validasi (422/404): `request_id` harus request (`REQ`) berstatus
                `approved` dengan minimal 1 line; `warehouse_id` wajib & aktif.
            security:
                - bearerAuth: []
            parameters:
                - { $ref: "#/components/parameters/XWarehouseId" }
                - { $ref: "#/components/parameters/IdempotencyKey" }
            requestBody:
                required: true
                content:
                    application/json:
                        schema: { $ref: "#/components/schemas/CreateDeliveryRequest" }
            responses:
                "201":
                    description: DO draft created (or replayed for the same idempotency key)
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - { $ref: "#/components/schemas/ApiResponse" }
                                    - type: object
                                      properties:
                                          data:
                                              {
                                                  $ref: "#/components/schemas/DeliveryDocument",
                                              }
                "401": { $ref: "#/components/responses/Error" }
                "403": { $ref: "#/components/responses/Error" }
                "404": { $ref: "#/components/responses/Error" }
                "409": { $ref: "#/components/responses/Error" }
                "422": { $ref: "#/components/responses/ValidationError" }

    /deliveries/{id}/submit:
        post:
            tags: [Outbound M4]
            summary: Submit a DO for approval (Fase 7.1, FSD 4.4)
            description: |
                Transisi `draft → submitted`. Requires `do.approve`.
            security:
                - bearerAuth: []
            parameters:
                - { $ref: "#/components/parameters/XWarehouseId" }
                - { $ref: "#/components/parameters/ItemID" }
            responses:
                "200":
                    description: Submitted
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - { $ref: "#/components/schemas/ApiResponse" }
                                    - type: object
                                      properties:
                                          data:
                                              {
                                                  $ref: "#/components/schemas/OutboundStatus",
                                              }
                "401": { $ref: "#/components/responses/Error" }
                "403": { $ref: "#/components/responses/Error" }
                "404": { $ref: "#/components/responses/Error" }
                "409": { $ref: "#/components/responses/Error" }
                "422": { $ref: "#/components/responses/ValidationError" }

    /deliveries/{id}/approve:
        post:
            tags: [Outbound M4]
            summary: Approve a DO (Fase 7.1, BR-05)
            description: |
                Transisi `submitted → approved` dengan maker-checker. Alokasi
                hanya bisa dilakukan pada DO berstatus `approved`.
                Requires `do.approve`.
            security:
                - bearerAuth: []
            parameters:
                - { $ref: "#/components/parameters/XWarehouseId" }
                - { $ref: "#/components/parameters/ItemID" }
            responses:
                "200":
                    description: Approved
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - { $ref: "#/components/schemas/ApiResponse" }
                                    - type: object
                                      properties:
                                          data:
                                              {
                                                  $ref: "#/components/schemas/OutboundStatus",
                                              }
                "401": { $ref: "#/components/responses/Error" }
                "403": { $ref: "#/components/responses/Error" }
                "404": { $ref: "#/components/responses/Error" }
                "409": { $ref: "#/components/responses/Error" }
                "422": { $ref: "#/components/responses/ValidationError" }

    /deliveries/{id}/allocate:
        post:
            tags: [Outbound M4]
            summary: Allocate stock FEFO/FIFO (Fase 7.2, FR-4.2)
            description: |
                Menjalankan engine alokasi: kandidat stok `available` di lokasi
                pick/bulk dikunci dengan `SELECT ... FOR UPDATE` dan diurutkan
                `expiry_date NULLS LAST, b.id, pick_seq` (FEFO untuk barang
                ber-expiry, FIFO sebagai tie-breaker). Setiap potongan membuat
                baris `doc.allocations` dan menaikkan `qty_reserved`. Jika saldo
                bebas tidak cukup, seluruh transaksi digagalkan dengan
                409 ERR_STOCK_INSUFFICIENT + detail kekurangan per line.
                Requires `do.allocate`; dokumen harus `approved`.

                Validasi (422): `lines` minimal 1; per baris — `line_id` milik
                DO ini, `qty` > 0 dan tidak melebihi sisa line.
            security:
                - bearerAuth: []
            parameters:
                - { $ref: "#/components/parameters/XWarehouseId" }
                - { $ref: "#/components/parameters/ItemID" }
            requestBody:
                required: true
                content:
                    application/json:
                        schema: { $ref: "#/components/schemas/AllocateRequest" }
            responses:
                "200":
                    description: Allocations created (qty_reserved increased)
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - { $ref: "#/components/schemas/ApiResponse" }
                                    - type: object
                                      properties:
                                          data:
                                              type: array
                                              items:
                                                  {
                                                      $ref: "#/components/schemas/AllocationResult",
                                                  }
                "401": { $ref: "#/components/responses/Error" }
                "403": { $ref: "#/components/responses/Error" }
                "404": { $ref: "#/components/responses/Error" }
                "409": { $ref: "#/components/responses/Error" }
                "422": { $ref: "#/components/responses/ValidationError" }

    /deliveries/{id}/allocate/override:
        post:
            tags: [Outbound M4]
            summary: Override allocation to specific balances (Fase 7.3)
            description: |
                Alokasi manual ke balance tertentu (diluar urutan FEFO/FIFO).
                Khusus pengguna dengan izin `outbound.override_allocation`
                (ditegakkan middleware) dan wajib mengisi `reason_code` yang
                disimpan di `doc.documents.reason_code`. Setiap line harus
                menentukan `balance_id`; balance harus available, non-expired,
                milik warehouse yang sama dan itemnya cocok dengan line.
            security:
                - bearerAuth: []
            parameters:
                - { $ref: "#/components/parameters/XWarehouseId" }
                - { $ref: "#/components/parameters/ItemID" }
            requestBody:
                required: true
                content:
                    application/json:
                        schema: { $ref: "#/components/schemas/OverrideAllocateRequest" }
            responses:
                "200":
                    description: Manual allocations created with reason recorded
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - { $ref: "#/components/schemas/ApiResponse" }
                                    - type: object
                                      properties:
                                          data:
                                              type: array
                                              items:
                                                  {
                                                      $ref: "#/components/schemas/AllocationResult",
                                                  }
                "401": { $ref: "#/components/responses/Error" }
                "403": { $ref: "#/components/responses/Error" }
                "404": { $ref: "#/components/responses/Error" }
                "409": { $ref: "#/components/responses/Error" }
                "422": { $ref: "#/components/responses/ValidationError" }

    /deliveries/{id}/picking-list:
        get:
            tags: [Outbound M4]
            summary: Picking list ordered by pick_seq (Fase 7.4, FR-4.3)
            description: |
                Daftar alokasi untuk pengambilan, diurutkan sekuensial
                `pick_seq NULLS LAST, code, id` untuk meminimalkan jarak jalan
                petugas. Dokumen harus `approved`/`in_progress`.
                Requires `do.pick`.
            security:
                - bearerAuth: []
            parameters:
                - { $ref: "#/components/parameters/XWarehouseId" }
                - { $ref: "#/components/parameters/ItemID" }
            responses:
                "200":
                    description: Picking list (JSON)
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - { $ref: "#/components/schemas/ApiResponse" }
                                    - type: object
                                      properties:
                                          data:
                                              type: array
                                              items:
                                                  {
                                                      $ref: "#/components/schemas/PickingListItem",
                                                  }
                "401": { $ref: "#/components/responses/Error" }
                "403": { $ref: "#/components/responses/Error" }
                "404": { $ref: "#/components/responses/Error" }
                "409": { $ref: "#/components/responses/Error" }
                "422": { $ref: "#/components/responses/ValidationError" }

    /deliveries/{id}/pick:
        post:
            tags: [Outbound M4]
            summary: Confirm picking via barcode scan (Fase 7.5, FR-4.4)
            description: |
                Menerima hasil scan petugas (allocation_id + barcode lokasi +
                barcode item + qty). Setiap scan divalidasi terhadap alokasi;
                jika barcode item/lokasi tidak cocok, proses langsung diblokir
                dengan 409 ERR_SCAN_MISMATCH dan tidak ada baris yang diproses.
                Scan yang valid menaikkan `qty_picked` alokasi dan
                `qty_processed` line. Requires `do.pick`.

                Validasi (422): `scans` minimal 1; per scan — `allocation_id`
                milik DO ini, `qty` > 0 dan ≤ sisa alokasi, barcode dikenal.
            security:
                - bearerAuth: []
            parameters:
                - { $ref: "#/components/parameters/XWarehouseId" }
                - { $ref: "#/components/parameters/ItemID" }
            requestBody:
                required: true
                content:
                    application/json:
                        schema: { $ref: "#/components/schemas/PickRequest" }
            responses:
                "200":
                    description: Picking confirmed
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - { $ref: "#/components/schemas/ApiResponse" }
                                    - type: object
                                      properties:
                                          data:
                                              {
                                                  $ref: "#/components/schemas/OutboundStatus",
                                              }
                "401": { $ref: "#/components/responses/Error" }
                "403": { $ref: "#/components/responses/Error" }
                "404": { $ref: "#/components/responses/Error" }
                "409": { $ref: "#/components/responses/Error" }
                "422": { $ref: "#/components/responses/ValidationError" }

    /deliveries/{id}/ship:
        post:
            tags: [Outbound M4]
            summary: Post shipment & issue surat jalan (Fase 7.6, FR-4.5)
            description: |
                Posting pengeluaran akhir: melepas reservasi, mengurangi
                `qty_onhand` dan `qty_reserved`, menulis baris `issue` negatif
                ke ledger stok (FSD 4.1), mencatat kendaraan/sopir ke
                `doc.deliveries`, dan mengubah status `approved → in_progress`.
                Membutuhkan minimal satu alokasi yang sudah di-pick.
                Requires `do.ship`.
            security:
                - bearerAuth: []
            parameters:
                - { $ref: "#/components/parameters/XWarehouseId" }
                - { $ref: "#/components/parameters/ItemID" }
            requestBody:
                required: true
                content:
                    application/json:
                        schema: { $ref: "#/components/schemas/ShipRequest" }
            responses:
                "200":
                    description: Shipped; status after posting
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - { $ref: "#/components/schemas/ApiResponse" }
                                    - type: object
                                      properties:
                                          data:
                                              {
                                                  $ref: "#/components/schemas/OutboundStatus",
                                              }
                "401": { $ref: "#/components/responses/Error" }
                "403": { $ref: "#/components/responses/Error" }
                "404": { $ref: "#/components/responses/Error" }
                "409": { $ref: "#/components/responses/Error" }
                "422": { $ref: "#/components/responses/ValidationError" }

    /deliveries/{id}/pod:
        post:
            tags: [Outbound M4]
            summary: Record proof of delivery & close document (Fase 7.7, FR-4.6)
            description: |
                Mencatat serah terima: nama penerima, waktu kedatangan, dan URL
                berkas foto/tanda tangan (diunggah klien terlebih dahulu). DO
                ditutup final `in_progress → completed` (BR-10). Requires
                `do.pod`; dokumen harus `in_progress`.

                Validasi (422): `received_by` wajib; `received_at` format
                RFC3339 bila diisi; dokumen harus `in_progress` (409).
            security:
                - bearerAuth: []
            parameters:
                - { $ref: "#/components/parameters/XWarehouseId" }
                - { $ref: "#/components/parameters/ItemID" }
            requestBody:
                required: true
                content:
                    application/json:
                        schema: { $ref: "#/components/schemas/PodRequest" }
            responses:
                "200":
                    description: POD recorded; document completed
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - { $ref: "#/components/schemas/ApiResponse" }
                                    - type: object
                                      properties:
                                          data:
                                              {
                                                  $ref: "#/components/schemas/OutboundStatus",
                                              }
                "401": { $ref: "#/components/responses/Error" }
                "403": { $ref: "#/components/responses/Error" }
                "404": { $ref: "#/components/responses/Error" }
                "409": { $ref: "#/components/responses/Error" }
                "422": { $ref: "#/components/responses/ValidationError" }

    /openapi.yaml:
        get:
            tags: [API Docs]
            summary: This OpenAPI spec (YAML)
            security: []
            responses:
                "200":
                    description: OpenAPI 3.1 YAML document
                    content:
                        application/yaml:
                            schema: { type: string }

    /openapi.json:
        get:
            tags: [API Docs]
            summary: This OpenAPI spec (JSON)
            security: []
            responses:
                "200":
                    description: OpenAPI 3.1 JSON document
                    content:
                        application/json:
                            schema: { type: object }

components:
    securitySchemes:
        bearerAuth:
            type: http
            scheme: bearer
            bearerFormat: JWT
        cookieAuth:
            type: apiKey
            in: cookie
            name: access_token
            description: |
                HttpOnly cookie set automatically by POST /auth/login and POST /auth/refresh
                (alternative to the Authorization header for browser clients).

    parameters:
        XWarehouseId:
            name: X-Warehouse-Id
            in: header
            required: true
            description: Active warehouse code (must be one of the user's assigned warehouses)
            schema: { type: string, example: WH01 }
        ItemID:
            name: id
            in: path
            required: true
            schema: { type: integer, format: int64, minimum: 1 }
        IdempotencyKey:
            name: Idempotency-Key
            in: header
            required: false
            description: |
                UUIDv4 idempotency key (FSD 4.5) — wajib pada semua POST yang
                memposting stok. Kunci disimpan di `doc.documents.idempotency_key`
                (UNIQUE); kirim ulang kunci yang sama mengembalikan dokumen yang
                sudah ada (200) alih-alih membuat duplikat. Nilai non-UUIDv4
                ditolak dengan 422 ERR_VALIDATION oleh middleware idempotensi.
            schema:
                {
                    type: string,
                    format: uuid,
                    example: 3f7c1b2e-6a4d-4f8e-9c2b-1d5a8e7f3a41,
                }

    responses:
        Error:
            description: Error response (FSD §5.4 envelope)
            content:
                application/json:
                    schema: { $ref: "#/components/schemas/ApiResponse" }
        ValidationError:
            description: Input validation failed (422 ERR_VALIDATION with field details)
            content:
                application/json:
                    schema: { $ref: "#/components/schemas/ApiResponse" }
        RateLimited:
            description: Rate limit exceeded (429)
            content:
                application/json:
                    schema: { $ref: "#/components/schemas/ApiResponse" }

    schemas:
        ApiResponse:
            type: object
            required: [success, data, error]
            properties:
                success: { type: boolean }
                data: {}
                meta:
                    type: object
                    properties:
                        page_size: { type: integer }
                        next_cursor: { type: string }
                error:
                    nullable: true
                    allOf: [{ $ref: "#/components/schemas/ApiError" }]
        ApiError:
            type: object
            properties:
                code: { type: string, example: ERR_VALIDATION }
                message: { type: string }
                details:
                    type: array
                    items: { $ref: "#/components/schemas/ErrorDetail" }
                request_id: { type: string, format: uuid }
        ErrorDetail:
            type: object
            properties:
                field: { type: string, example: password }
                message:
                    {
                        type: string,
                        example: must be at least 12 characters long,
                    }
                sku: { type: string }
                requested: {}
                available: {}

        LoginRequest:
            type: object
            description: |
                Aturan validasi (422 ERR_VALIDATION + field details):
                - `username` wajib, 3-50 karakter.
                - `password` wajib (panjang tidak diperiksa saat login agar
                  kebijakan password tidak bocor ke penyerang).
                - Gagal 5x dalam 15 menit per IP -> 429 rate limited.
            required: [username, password]
            properties:
                username:
                    {
                        type: string,
                        minLength: 3,
                        maxLength: 50,
                        description: "Wajib, 3-50 karakter",
                    }
                password:
                    {
                        type: string,
                        description: "Wajib. Tidak ada batas panjang yang diberlakukan di sini",
                    }
        RegisterRequest:
            type: object
            description: |
                Aturan validasi (422 ERR_VALIDATION + field details):
                - `username` wajib, 3-50 karakter.
                - `email` wajib, format email valid, maksimal 150 karakter.
                - `full_name` wajib, 1-150 karakter.
                - `password` wajib, minimal 12 karakter (FSD §6), maksimal 72
                  (batas Argon2id). Disimpan sebagai hash Argon2id.
                - 10 percobaan / 15 menit per IP -> 429.
            required: [username, email, full_name, password]
            properties:
                username:
                    {
                        type: string,
                        minLength: 3,
                        maxLength: 50,
                        description: "Wajib, 3-50 karakter",
                    }
                email:
                    {
                        type: string,
                        format: email,
                        maxLength: 150,
                        description: "Wajib, format email valid, maksimal 150 karakter",
                    }
                full_name:
                    {
                        type: string,
                        minLength: 1,
                        maxLength: 150,
                        description: "Wajib, 1-150 karakter",
                    }
                password:
                    {
                        type: string,
                        minLength: 12,
                        maxLength: 72,
                        description: "Wajib, minimal 12 karakter (FSD §6), maksimal 72. Argon2id hashed server-side",
                    }
        RefreshRequest:
            type: object
            description: |
                Aturan validasi (422 ERR_VALIDATION + field details):
                - `refresh_token` wajib (tidak kosong).
            required: [refresh_token]
            properties:
                refresh_token:
                    {
                        type: string,
                        description: "Wajib. Refresh token JWT aktif (7 hari)",
                    }
        TokenPair:
            type: object
            properties:
                access_token: { type: string, description: JWT, 15 min TTL }
                refresh_token:
                    { type: string, description: Rotating JWT, 7 day TTL }
                token_type: { type: string, example: Bearer }
        RegisterResponse:
            type: object
            properties:
                id: { type: integer, format: int64 }
                username: { type: string }
                full_name: { type: string }

        ItemUoMInput:
            type: object
            description: |
                Aturan validasi (422): `uom` wajib 1-20 karakter; `conv_factor`
                wajib > 0; `barcode` optional maksimal 64 karakter.
            required: [uom, conv_factor]
            properties:
                uom:
                    {
                        type: string,
                        minLength: 1,
                        maxLength: 20,
                        description: "Wajib, 1-20 karakter",
                    }
                conv_factor:
                    {
                        type: number,
                        format: double,
                        exclusiveMinimum: 0,
                        description: "Wajib, > 0. Konversi ke base UOM (contoh 1 BOX = 24 PCS)",
                    }
                barcode:
                    {
                        type: string,
                        nullable: true,
                        maxLength: 64,
                        description: "Optional, maksimal 64 karakter",
                    }
        CreateItemRequest:
            type: object
            description: |
                Aturan validasi (422 ERR_VALIDATION + field details):
                - `sku`, `name`, `base_uom` wajib (1-50 / 1-150 / 1-20 karakter).
                - `min_qty`, `safety_stock`, `lead_time_days` >= 0.
                - `max_qty` optional, >= 0 dan harus >= `min_qty`.
                - `abc_class` salah satu dari A/B/C (kosong = belum diklasifikasi).
                - Setiap elemen `uoms` divalidasi (dive).
            required: [sku, name, base_uom]
            properties:
                sku:
                    {
                        type: string,
                        minLength: 1,
                        maxLength: 50,
                        description: "Wajib, 1-50 karakter, unik",
                    }
                name:
                    {
                        type: string,
                        minLength: 1,
                        maxLength: 150,
                        description: "Wajib, 1-150 karakter",
                    }
                category_id:
                    {
                        type: integer,
                        format: int64,
                        nullable: true,
                        minimum: 1,
                        description: "Optional (gt=0)",
                    }
                base_uom:
                    {
                        type: string,
                        minLength: 1,
                        maxLength: 20,
                        description: "Wajib, 1-20 karakter (contoh PCS/KG)",
                    }
                is_batch: { type: boolean, default: false }
                is_expiry:
                    {
                        type: boolean,
                        default: false,
                        description: "Requires is_batch=true",
                    }
                is_serial: { type: boolean, default: false }
                min_qty:
                    {
                        type: number,
                        format: double,
                        minimum: 0,
                        description: "Wajib, >= 0 (default 0)",
                    }
                max_qty:
                    {
                        type: number,
                        format: double,
                        nullable: true,
                        minimum: 0,
                        description: "Optional, >= 0 dan harus >= min_qty",
                    }
                safety_stock:
                    {
                        type: number,
                        format: double,
                        minimum: 0,
                        description: "Wajib, >= 0 (default 0)",
                    }
                lead_time_days:
                    {
                        type: integer,
                        minimum: 0,
                        description: "Wajib, >= 0 (default 0)",
                    }
                abc_class:
                    {
                        type: string,
                        nullable: true,
                        enum: [A, B, C],
                        description: "Optional, salah satu A/B/C",
                    }
                uoms:
                    type: array
                    description: Optional; setiap elemen divalidasi (dive)
                    items: { $ref: "#/components/schemas/ItemUoMInput" }
        UpdateItemRequest:
            type: object
            description: |
                Aturan validasi (422): `name`, `base_uom` wajib; `max_qty` >= 0
                dan >= `min_qty`; `abc_class` salah satu A/B/C; `lead_time_days`
                >= 0. Path `:id` harus bilangan bulat positif.
            required: [name, base_uom]
            properties:
                name:
                    {
                        type: string,
                        minLength: 1,
                        maxLength: 150,
                        description: "Wajib, 1-150 karakter",
                    }
                category_id:
                    {
                        type: integer,
                        format: int64,
                        nullable: true,
                        minimum: 1,
                        description: "Optional (gt=0)",
                    }
                base_uom:
                    {
                        type: string,
                        minLength: 1,
                        maxLength: 20,
                        description: "Wajib, 1-20 karakter",
                    }
                is_batch: { type: boolean }
                is_expiry: { type: boolean }
                is_serial: { type: boolean }
                min_qty:
                    {
                        type: number,
                        format: double,
                        minimum: 0,
                        description: "Wajib, >= 0",
                    }
                max_qty:
                    {
                        type: number,
                        format: double,
                        nullable: true,
                        minimum: 0,
                        description: "Optional, >= 0 dan harus >= min_qty",
                    }
                safety_stock:
                    {
                        type: number,
                        format: double,
                        minimum: 0,
                        description: "Wajib, >= 0",
                    }
                lead_time_days:
                    {
                        type: integer,
                        minimum: 0,
                        description: "Wajib, >= 0",
                    }
                abc_class:
                    {
                        type: string,
                        nullable: true,
                        enum: [A, B, C],
                        description: "Optional, salah satu A/B/C",
                    }
                is_active: { type: boolean }
        Item:
            type: object
            properties:
                id: { type: integer, format: int64 }
                public_id: { type: string, format: uuid }
                sku: { type: string }
                name: { type: string }
                category_id: { type: integer, format: int64, nullable: true }
                base_uom: { type: string }
                is_batch: { type: boolean }
                is_expiry: { type: boolean }
                is_serial: { type: boolean }
                min_qty: { type: number, format: double }
                max_qty: { type: number, format: double, nullable: true }
                safety_stock: { type: number, format: double }
                lead_time_days: { type: integer }
                abc_class: { type: string, nullable: true }
                is_active: { type: boolean }
        ItemDetail:
            allOf:
                - { $ref: "#/components/schemas/Item" }
                - type: object
                  properties:
                      created_at: { type: string, format: date-time }
                      created_by: { type: integer, format: int64 }
        ItemUoM:
            type: object
            properties:
                id: { type: integer, format: int64 }
                item_id: { type: integer, format: int64 }
                uom: { type: string }
                conv_factor: { type: number, format: double }
                barcode: { type: string, nullable: true }

        CreateLocationRequest:
            type: object
            description: |
                Aturan validasi (422 ERR_VALIDATION + field details):
                - `warehouse_id` wajib (gt=0), `code` wajib 1-30 karakter,
                  `loc_type` wajib salah satu enum.
                - `zone`/`rack`/`level` optional maksimal 20 karakter.
                - `pick_seq` optional >= 0; `capacity` optional >= 0.
                - `code` harus unik per warehouse (409 ERR_DUPLICATE_KEY).
            required: [warehouse_id, code, loc_type]
            properties:
                warehouse_id:
                    {
                        type: integer,
                        format: int64,
                        minimum: 1,
                        description: "Wajib, gt=0",
                    }
                code:
                    {
                        type: string,
                        minLength: 1,
                        maxLength: 30,
                        description: "Wajib, 1-30 karakter, unik per warehouse",
                    }
                zone:
                    {
                        type: string,
                        nullable: true,
                        maxLength: 20,
                        description: "Optional, maksimal 20 karakter",
                    }
                rack:
                    {
                        type: string,
                        nullable: true,
                        maxLength: 20,
                        description: "Optional, maksimal 20 karakter",
                    }
                level:
                    {
                        type: string,
                        nullable: true,
                        maxLength: 20,
                        description: "Optional, maksimal 20 karakter",
                    }
                loc_type:
                    {
                        type: string,
                        enum:
                            [staging, pick, bulk, quarantine, damaged, transit],
                        description: "Wajib, salah satu enum",
                    }
                pick_seq:
                    {
                        type: integer,
                        nullable: true,
                        minimum: 0,
                        description: "Optional, >= 0. Urutan picking (kecil = dipilih dulu)",
                    }
                capacity:
                    {
                        type: number,
                        format: double,
                        nullable: true,
                        minimum: 0,
                        description: "Optional, >= 0. Kapasitas maksimum lokasi (unit stok)",
                    }
        Location:
            type: object
            properties:
                id: { type: integer, format: int64 }
                warehouse_id: { type: integer, format: int64 }
                code: { type: string }
                zone: { type: string, nullable: true }
                rack: { type: string, nullable: true }
                level: { type: string, nullable: true }
                loc_type: { type: string }
                pick_seq: { type: integer, nullable: true }
                capacity: { type: number, format: double, nullable: true }
                is_active: { type: boolean }

        CreatePartnerRequest:
            type: object
            description: |
                Aturan validasi (422 ERR_VALIDATION + field details):
                - `code`, `partner_type`, `name` wajib (1-30 / enum / 1-150).
                - `address` optional maksimal 500; `contact_name` maksimal 100;
                  `contact_phone` maksimal 30.
                - `code` harus unik (409 ERR_DUPLICATE_KEY).
                - Data kontak dienkripsi saat istirahat (UU PDP).
            required: [code, partner_type, name]
            properties:
                code:
                    {
                        type: string,
                        minLength: 1,
                        maxLength: 30,
                        description: "Wajib, 1-30 karakter, unik",
                    }
                partner_type:
                    {
                        type: string,
                        enum: [supplier, customer, internal_unit],
                        description: "Wajib, salah satu enum",
                    }
                name:
                    {
                        type: string,
                        minLength: 1,
                        maxLength: 150,
                        description: "Wajib, 1-150 karakter",
                    }
                address:
                    {
                        type: string,
                        maxLength: 500,
                        description: "Optional, maksimal 500 karakter",
                    }
                contact_name:
                    {
                        type: string,
                        maxLength: 100,
                        description: "Optional, maksimal 100 karakter. Encrypted at rest (UU PDP)",
                    }
                contact_phone:
                    {
                        type: string,
                        maxLength: 30,
                        description: "Optional, maksimal 30 karakter. Encrypted at rest (UU PDP)",
                    }
        Partner:
            type: object
            properties:
                id: { type: integer, format: int64 }
                code: { type: string }
                partner_type: { type: string }
                name: { type: string }
                address: { type: string, nullable: true }
                contact_name: { type: string, nullable: true }
                contact_phone: { type: string, nullable: true }
                is_active: { type: boolean }

        StockMovement:
            type: object
            properties:
                id: { type: integer, format: int64 }
                moved_at: { type: string, format: date-time }
                item_id: { type: integer, format: int64 }
                location_id: { type: integer, format: int64 }
                batch_id: { type: integer, format: int64, nullable: true }
                status:
                    {
                        type: string,
                        enum:
                            [
                                available,
                                quarantine,
                                damaged,
                                expired,
                                in_transit,
                            ],
                    }
                movement_type:
                    {
                        type: string,
                        enum:
                            [
                                receipt,
                                issue,
                                transfer_out,
                                transfer_in,
                                adjustment,
                                putaway,
                                internal_move,
                                return_in,
                                return_out,
                                opening,
                            ],
                    }
                qty:
                    {
                        type: number,
                        format: double,
                        description: "(+) in, (-) out",
                    }
                qty_after: { type: number, format: double }
                doc_no: { type: string }
        StockMovementList:
            type: object
            properties:
                data:
                    type: array
                    items: { $ref: "#/components/schemas/StockMovement" }
                next_cursor:
                    { type: string, description: Empty when no more pages }

        ImportJobResponse:
            type: object
            properties:
                job_id: { type: string }
                status: { type: string, example: queued }

        # ── Fase 6: Inbound M2 (GRN) ────────────────────────────────────────

        CreateReceiptRequest:
            type: object
            description: |
                Aturan validasi (422 ERR_VALIDATION + field details):
                - `warehouse_id` wajib (integer > 0) dan harus warehouse aktif.
                - `lines` wajib berisi minimal 1 baris; setiap baris divalidasi
                  terhadap master data (item aktif, qty > 0, UOM terdaftar,
                  batch/expiry sesuai atribut item, status hasil QC valid).
                - `idempotency_key` (bila ada) harus UUIDv4 — atau kirim lewat
                  header `Idempotency-Key` (FSD 4.5).
            required: [warehouse_id, lines]
            properties:
                warehouse_id:
                    {
                        type: integer,
                        format: int64,
                        minimum: 1,
                        description: "Wajib. ID warehouse tujuan (gt=0)",
                    }
                partner_id:
                    {
                        type: integer,
                        format: int64,
                        nullable: true,
                        minimum: 1,
                        description: "Optional. Supplier/vendor (gt=0)",
                    }
                idempotency_key:
                    {
                        type: string,
                        format: uuid,
                        description: "Optional UUIDv4 — alternatif dari header Idempotency-Key (FSD 4.5)",
                    }
                notes:
                    {
                        type: string,
                        maxLength: 1000,
                        description: "Optional. Maksimal 1000 karakter",
                    }
                lines:
                    type: array
                    minItems: 1
                    description: "Wajib, minimal 1 baris"
                    items: { $ref: "#/components/schemas/ReceiptLineRequest" }

        ReceiptLineRequest:
            type: object
            required: [item_id, qty]
            properties:
                item_id:
                    {
                        type: integer,
                        format: int64,
                        minimum: 1,
                        description: "Wajib. ID item master (gt=0); item harus aktif",
                    }
                qty:
                    {
                        type: number,
                        format: double,
                        exclusiveMinimum: 0,
                        description: "Wajib, > 0. Quantity dalam UOM baris (default: base UOM item)",
                    }
                uom:
                    {
                        type: string,
                        maxLength: 20,
                        description: "Optional. Kosong = base UOM item (contoh PCS/BOX/KG); harus terdaftar di item",
                    }
                batch_no:
                    {
                        type: string,
                        maxLength: 60,
                        description: "Wajib untuk item batch-managed (is_batch); dilarang untuk item non-batch",
                    }
                expiry_date:
                    {
                        type: string,
                        format: date,
                        description: "Wajib untuk item expiry-managed (is_expiry). Format YYYY-MM-DD",
                    }
                status:
                    {
                        type: string,
                        enum: [available, quarantine, damaged],
                        description: "Hasil QC saat penerimaan. Optional, default available",
                    }
                notes:
                    {
                        type: string,
                        maxLength: 500,
                        description: "Optional. Maksimal 500 karakter",
                    }

        ReceiptDocument:
            type: object
            properties:
                id: { type: integer, format: int64 }
                public_id: { type: string, format: uuid }
                doc_no: { type: string, example: "GRN/WH01/2608/00016" }
                doc_type: { type: string, example: GRN }
                doc_date: { type: string, format: date }
                status:
                    {
                        type: string,
                        enum:
                            [
                                draft,
                                submitted,
                                approved,
                                in_progress,
                                completed,
                                cancelled,
                            ],
                    }
                warehouse_id: { type: integer, format: int64 }
                notes: { type: string, nullable: true }
                created_by: { type: integer, format: int64 }
                lines:
                    type: array
                    items: { $ref: "#/components/schemas/ReceiptLineSummary" }

        ReceiptLineSummary:
            type: object
            properties:
                id: { type: integer, format: int64 }
                line_no: { type: integer }
                item_id: { type: integer, format: int64 }
                uom: { type: string }
                qty_request: { type: number, format: double }
                qty_processed: { type: number, format: double }
                batch_id: { type: integer, format: int64, nullable: true }
                location_id:
                    {
                        type: integer,
                        format: int64,
                        nullable: true,
                        description: "Target bin terakhir setelah putaway",
                    }
                status: { type: string, enum: [available, quarantine, damaged] }

        ReceiptStatus:
            type: object
            properties:
                id: { type: integer, format: int64 }
                status:
                    {
                        type: string,
                        description: "Status dokumen setelah aksi",
                        example: approved,
                    }

        PutawayRequest:
            type: object
            description: |
                Aturan validasi (422 ERR_VALIDATION + field details):
                - `lines` wajib, minimal 1 scan.
                - Setiap scan divalidasi sebelum transaksi: line milik dokumen,
                  qty > 0 dan tidak melebihi sisa qty line, lokasi tujuan harus
                  milik warehouse yang sama.
            required: [lines]
            properties:
                lines:
                    type: array
                    minItems: 1
                    description: "Wajib, minimal 1 scan"
                    items: { $ref: "#/components/schemas/PutawayScanRequest" }

        PutawayScanRequest:
            type: object
            description: |
                Aturan validasi (422 ERR_VALIDATION + field details):
                - `line_id` wajib, bilangan bulat > 0 (gt=0), dan harus milik
                  dokumen GRN ini.
                - `qty` wajib, angka > 0 dan tidak boleh melebihi sisa qty
                  yang belum diputaway dari baris tersebut.
                - `location_code` wajib, string 1-30 karakter, dan harus
                  merupakan kode lokasi yang ada di warehouse dokumen ini
                  (bukan lokasi staging).
            required: [line_id, qty, location_code]
            properties:
                line_id:
                    {
                        type: integer,
                        format: int64,
                        minimum: 1,
                        description: "Wajib. ID baris dokumen GRN (gt=0) yang sedang diputaway",
                    }
                qty:
                    {
                        type: number,
                        format: double,
                        exclusiveMinimum: 0,
                        description: "Wajib, > 0. Dalam UOM line; tidak boleh melebihi sisa qty line",
                    }
                location_code:
                    {
                        type: string,
                        maxLength: 30,
                        description: "Wajib. Kode bin tujuan (pick/bulk) milik warehouse yang sama, maksimal 30 karakter",
                        example: PK-01-01,
                    }

        PutawaySuggestion:
            type: object
            properties:
                line_id: { type: integer, format: int64 }
                item_id: { type: integer, format: int64 }
                qty_remaining: { type: number, format: double }
                locations:
                    type: array
                    items: { $ref: "#/components/schemas/SuggestedLocation" }

        SuggestedLocation:
            type: object
            properties:
                location_id: { type: integer, format: int64 }
                code: { type: string }
                zone: { type: string }
                rack: { type: string }
                level: { type: string }
                loc_type:
                    {
                        type: string,
                        enum:
                            [staging, pick, bulk, quarantine, damaged, transit],
                    }
                free_qty:
                    {
                        type: number,
                        format: double,
                        description: "Sisa kapasitas (0 = tak terbatas / belum diisi kapasitas)",
                    }

        CreateRequestRequest:
            type: object
            description: |
                Aturan validasi (422 ERR_VALIDATION + field details):
                - `warehouse_id` wajib (integer > 0) dan harus warehouse aktif.
                - `lines` wajib berisi minimal 1 baris; per baris — `item_id`
                  dikenal & aktif, `qty` > 0, `uom` terdaftar (kosong = base).
                - `idempotency_key` (bila ada) harus UUIDv4 — atau kirim lewat
                  header `Idempotency-Key` (FSD 4.5).
            required: [warehouse_id, lines]
            properties:
                warehouse_id:
                    {
                        type: integer,
                        format: int64,
                        minimum: 1,
                        description: "Wajib. ID warehouse tujuan (gt=0)",
                    }
                partner_id:
                    {
                        type: integer,
                        format: int64,
                        nullable: true,
                        minimum: 1,
                        description: "Optional. Unit/customer peminta (gt=0)",
                    }
                idempotency_key:
                    {
                        type: string,
                        format: uuid,
                        description: "Optional UUIDv4 — alternatif dari header Idempotency-Key (FSD 4.5)",
                    }
                notes:
                    {
                        type: string,
                        maxLength: 1000,
                        description: "Optional. Maksimal 1000 karakter",
                    }
                lines:
                    type: array
                    minItems: 1
                    description: "Wajib, minimal 1 baris"
                    items: { $ref: "#/components/schemas/RequestLineRequest" }

        RequestLineRequest:
            type: object
            required: [item_id, qty]
            properties:
                item_id:
                    {
                        type: integer,
                        format: int64,
                        minimum: 1,
                        description: "Wajib. ID item master (gt=0); item harus aktif",
                    }
                qty:
                    {
                        type: number,
                        format: double,
                        exclusiveMinimum: 0,
                        description: "Wajib, > 0. Quantity dalam UOM baris",
                    }
                uom:
                    {
                        type: string,
                        maxLength: 20,
                        description: "Optional. Kosong = base UOM item; harus terdaftar di item",
                    }
                notes:
                    {
                        type: string,
                        maxLength: 500,
                        description: "Optional. Maksimal 500 karakter",
                    }

        RequestDocument:
            type: object
            properties:
                id: { type: integer, format: int64 }
                public_id: { type: string, format: uuid }
                doc_no: { type: string, example: "REQ/WH01/2608/00016" }
                doc_type: { type: string, example: REQ }
                doc_date: { type: string, format: date }
                status:
                    {
                        type: string,
                        enum: [draft, submitted, approved, in_progress, completed, cancelled],
                    }
                warehouse_id: { type: integer, format: int64 }
                partner_id: { type: integer, format: int64, nullable: true }
                notes: { type: string, nullable: true }
                created_by: { type: integer, format: int64 }
                lines:
                    type: array
                    items: { $ref: "#/components/schemas/RequestLineSummary" }

        RequestLineSummary:
            type: object
            properties:
                id: { type: integer, format: int64 }
                line_no: { type: integer }
                item_id: { type: integer, format: int64 }
                uom: { type: string }
                qty_request: { type: number, format: double }
                qty_processed: { type: number, format: double }

        CreateDeliveryRequest:
            type: object
            description: |
                Aturan validasi (422 ERR_VALIDATION + field details):
                - `request_id` wajib (gt=0) dan harus request (`REQ`) berstatus
                  `approved` dengan minimal 1 line.
                - `warehouse_id` wajib (gt=0) dan harus warehouse aktif.
                - `idempotency_key` (bila ada) harus UUIDv4.
            required: [warehouse_id, request_id]
            properties:
                warehouse_id:
                    {
                        type: integer,
                        format: int64,
                        minimum: 1,
                        description: "Wajib. ID warehouse pengirim (gt=0)",
                    }
                request_id:
                    {
                        type: integer,
                        format: int64,
                        minimum: 1,
                        description: "Wajib. ID request yang sudah disetujui",
                    }
                partner_id:
                    {
                        type: integer,
                        format: int64,
                        nullable: true,
                        minimum: 1,
                        description: "Optional. Customer tujuan (gt=0)",
                    }
                idempotency_key:
                    {
                        type: string,
                        format: uuid,
                        description: "Optional UUIDv4 — alternatif dari header Idempotency-Key (FSD 4.5)",
                    }
                notes:
                    {
                        type: string,
                        maxLength: 1000,
                        description: "Optional. Maksimal 1000 karakter",
                    }

        DeliveryDocument:
            type: object
            properties:
                id: { type: integer, format: int64 }
                public_id: { type: string, format: uuid }
                doc_no: { type: string, example: "DO/WH01/2608/00016" }
                doc_type: { type: string, example: DO }
                doc_date: { type: string, format: date }
                status:
                    {
                        type: string,
                        enum: [draft, submitted, approved, in_progress, completed, cancelled],
                    }
                warehouse_id: { type: integer, format: int64 }
                request_id: { type: integer, format: int64, nullable: true }
                partner_id: { type: integer, format: int64, nullable: true }
                notes: { type: string, nullable: true }
                created_by: { type: integer, format: int64 }
                lines:
                    type: array
                    items: { $ref: "#/components/schemas/DeliveryLineSummary" }

        DeliveryLineSummary:
            type: object
            properties:
                id: { type: integer, format: int64 }
                line_no: { type: integer }
                item_id: { type: integer, format: int64 }
                uom: { type: string }
                qty_request: { type: number, format: double }
                qty_processed: { type: number, format: double }

        AllocateRequest:
            type: object
            description: |
                Aturan validasi (422 ERR_VALIDATION + field details):
                - `lines` wajib, minimal 1.
                - Per baris: `line_id` harus milik DO ini; `qty` > 0 dan tidak
                  boleh melebihi sisa line (qty × conv_factor dihitung di
                  backend). Dokumen harus `approved` (409 bila bukan).
            required: [lines]
            properties:
                lines:
                    type: array
                    minItems: 1
                    items: { $ref: "#/components/schemas/AllocateLineRequest" }

        AllocateLineRequest:
            type: object
            required: [line_id, qty]
            properties:
                line_id:
                    {
                        type: integer,
                        format: int64,
                        minimum: 1,
                        description: "Wajib. ID baris DO yang dialokasikan",
                    }
                qty:
                    {
                        type: number,
                        format: double,
                        exclusiveMinimum: 0,
                        description: "Wajib, > 0. Quantity dalam UOM line",
                    }

        OverrideAllocateRequest:
            type: object
            description: |
                Aturan validasi (422 ERR_VALIDATION + field details):
                - `reason_code` wajib (maksimal 30 karakter) — disimpan di
                  `doc.documents.reason_code`.
                - `lines` wajib, minimal 1; per baris `balance_id` wajib dan
                  balance harus available, non-expired, milik warehouse yang
                  sama dan itemnya cocok dengan line.
            required: [reason_code, lines]
            properties:
                reason_code:
                    {
                        type: string,
                        maxLength: 30,
                        description: "Wajib. Alasan override (dicatat, BR-03)",
                    }
                lines:
                    type: array
                    minItems: 1
                    items: { $ref: "#/components/schemas/OverrideLineRequest" }

        OverrideLineRequest:
            type: object
            required: [line_id, qty, balance_id]
            properties:
                line_id:
                    {
                        type: integer,
                        format: int64,
                        minimum: 1,
                        description: "Wajib. ID baris DO",
                    }
                qty:
                    {
                        type: number,
                        format: double,
                        exclusiveMinimum: 0,
                        description: "Wajib, > 0. Quantity dalam UOM line",
                    }
                balance_id:
                    {
                        type: integer,
                        format: int64,
                        minimum: 1,
                        description: "Wajib. Balance spesifik yang dialokasikan manual",
                    }

        AllocationResult:
            type: object
            properties:
                line_id: { type: integer, format: int64 }
                allocation_id: { type: integer, format: int64 }
                balance_id: { type: integer, format: int64 }
                location_code: { type: string }
                batch_id: { type: integer, format: int64, nullable: true }
                qty_allocated: { type: number, format: double }

        PickingListItem:
            type: object
            properties:
                allocation_id: { type: integer, format: int64 }
                line_id: { type: integer, format: int64 }
                item_id: { type: integer, format: int64 }
                sku: { type: string }
                base_uom: { type: string }
                location_code: { type: string }
                pick_seq: { type: integer, nullable: true }
                batch_id: { type: integer, format: int64, nullable: true }
                batch_no: { type: string }
                qty_allocated: { type: number, format: double }
                qty_picked: { type: number, format: double }
                qty_remaining: { type: number, format: double }

        PickRequest:
            type: object
            description: |
                Aturan validasi (422 ERR_VALIDATION + field details):
                - `scans` wajib, minimal 1.
                - Per scan: `allocation_id` harus milik DO ini; `qty` > 0 dan
                  ≤ sisa alokasi; barcode item & lokasi harus cocok dengan
                  alokasi (jika tidak 409 ERR_SCAN_MISMATCH).
            required: [scans]
            properties:
                scans:
                    type: array
                    minItems: 1
                    items: { $ref: "#/components/schemas/PickScanRequest" }

        PickScanRequest:
            type: object
            required: [allocation_id, location_barcode, item_barcode, qty]
            properties:
                allocation_id:
                    {
                        type: integer,
                        format: int64,
                        minimum: 1,
                        description: "Wajib. ID alokasi yang di-pick",
                    }
                location_barcode:
                    {
                        type: string,
                        maxLength: 30,
                        description: "Wajib. Barcode/kode bin tujuan",
                    }
                item_barcode:
                    {
                        type: string,
                        maxLength: 64,
                        description: "Wajib. Barcode item yang discan",
                    }
                qty:
                    {
                        type: number,
                        format: double,
                        exclusiveMinimum: 0,
                        description: "Wajib, > 0. Quantity yang di-pick",
                    }

        ShipRequest:
            type: object
            properties:
                vehicle_no:
                    {
                        type: string,
                        maxLength: 20,
                        description: "Optional. Nomor kendaraan (surat jalan)",
                    }
                driver_name:
                    {
                        type: string,
                        maxLength: 100,
                        description: "Optional. Nama sopir/kurir",
                    }

        PodRequest:
            type: object
            description: |
                Aturan validasi (422 ERR_VALIDATION + field details):
                - `received_by` wajib (maksimal 100 karakter).
                - `received_at` optional, format RFC3339 bila diisi.
                - `pod_file_url` / `signature_url` optional (URL berkas foto /
                  tanda tangan, diunggah klien terlebih dahulu).
            required: [received_by]
            properties:
                received_by:
                    {
                        type: string,
                        maxLength: 100,
                        description: "Wajib. Nama penerima barang",
                    }
                received_at:
                    {
                        type: string,
                        format: date-time,
                        description: "Optional. Waktu kedatangan/serah terima (RFC3339)",
                    }
                pod_file_url:
                    {
                        type: string,
                        maxLength: 1000,
                        description: "Optional. URL bukti serah terima (foto)",
                    }
                signature_url:
                    {
                        type: string,
                        maxLength: 1000,
                        description: "Optional. URL tanda tangan",
                    }

        OutboundStatus:
            type: object
            properties:
                id: { type: integer, format: int64 }
                status:
                    {
                        type: string,
                        description: "Status dokumen setelah aksi",
                        example: approved,
                    }
