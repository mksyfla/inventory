version: "2"
sql:
    - engine: "postgresql"
      gen:
          go:
              emit_exact_table_names: true
              emit_interface: true
              emit_json_tags: true
              emit_prepared_queries: false
              out: "internal/repository/postgres"
              package: "postgres"
              sql_package: "pgx/v5"
      queries: "db/queries/"
      schema:
          - "db/migrations/000001_init.up.sql"
          - "db/migrations/000006_transfer_counting.up.sql"
