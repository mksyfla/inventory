# SIMBAR frontend — host statik SPA + reverse proxy API.
# Permintaan `/api/*` diteruskan ke service `api` (backend Go) di network
# compose. `proxy_pass` tanpa path → URI asli (`/api/v1/...`) dipertahankan,
# sesuai layout router backend (v1 group di /api/v1).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker embedded DNS — dipakai `proxy_pass` variabel (lihat location
    # /api/) untuk resolve service `api` saat request; tanpa ini nginx menolak
    # resolve hostname dinamis ("no resolver defined to resolve api").
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Gzip untuk aset statik
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Aset Vite ber-hash → cache lama, immutable
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback (react-router) — semua rute non-file → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxy → backend (compose service alias `api`).
    # `proxy_pass` memakai variabel → hostname di-resolve saat request, bukan
    # saat startup (nginx `emerg host not found in upstream` bila `api` belum
    # ada saat container dijalankan di luar network compose). Di dalam compose,
    # Docker DNS (127.0.0.11) me-resolve `api`. URI asli tetap diteruskan.
    location /api/ {
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
