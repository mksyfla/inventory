# ⚠️ DEVELOPMENT-ONLY COMPOSE (M-10)
# This file is a local development harness — APP_ENV=development, no TLS
# between services, secrets interpolated from .env with known dev defaults.
# It is NOT the production deployment path. Production requires: TLS-terminated
# Postgres/Redis (or rediss://), an internal metrics port, a separate seed
# target, and resource sizing reviewed for the actual workload.

services:
    # PostgreSQL Database
    db:
        container_name: inventory_postgres
        environment:
            - POSTGRES_USER=${POSTGRES_USER:-user}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
            - POSTGRES_DB=${POSTGRES_DB:-dbname}
        image: postgres:16
        # M-10: bound to the loopback interface only — the DB is for the compose
        # network and host-side debugging, not for the LAN.
        ports:
            - 127.0.0.1:5432:5432
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-dbname}",
                ]
            interval: 5s
            timeout: 3s
            retries: 10
            start_period: 10s
        deploy:
            resources:
                limits:
                    memory: 512M
                    cpus: "1.0"

    # Redis Cache
    redis:
        container_name: inventory_redis
        image: redis:8
        # M-10: not published to the host at all — only the compose network
        # needs it. Local `go run` flows may use their own instance.
        ports:
            - "127.0.0.1:6379:6379"
        volumes:
            - redis_data:/data
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 3s
            retries: 10
        deploy:
            resources:
                limits:
                    memory: 256M
                    cpus: "0.5"

    # One-shot migrator: menunggu Postgres naik, lalu menerapkan
    # db/migrations/*.up.sql secara berurutan (idempotent — skrip
    # db/migrate.sh mencatat versi di tabel simbar_migrations).
    migrate:
        container_name: inventory_migrate
        image: postgres:16
        depends_on:
            db:
                condition: service_healthy
        environment:
            - PGHOST=db
            - PGUSER=${POSTGRES_USER:-user}
            - PGPASSWORD=${POSTGRES_PASSWORD:-password}
            - PGDATABASE=${POSTGRES_DB:-dbname}
        volumes:
            - ./backend/db/migrations:/migrations:ro
            - ./backend/db/migrate.sh:/migrate.sh:ro
        command: ["sh", "/migrate.sh"]
        restart: "no"

    # Backend API (binary dari backend/Dockerfile)
    api:
        container_name: inventory_api
        build:
            context: ./backend
            dockerfile: Dockerfile
        image: simbar-backend:latest
        restart: unless-stopped
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_healthy
            migrate:
                condition: service_completed_successfully
        environment:
            - APP_ENV=development
            - PORT=8080
            - DB_CONN_STRING=postgres://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-dbname}?sslmode=disable
            - REDIS_ADDR=redis:6379
            - REDIS_PASSWORD=${REDIS_PASSWORD:-}
            - JWT_SECRET=${JWT_SECRET:?set JWT_SECRET in .env (see .env.example)}
            - AES_ENCRYPTION_KEY=${AES_ENCRYPTION_KEY:?set AES_ENCRYPTION_KEY in .env (see .env.example)}
            - DB_POOL_MAX=10
            - DB_POOL_MIN=2
        ports:
            # Loopback only — the frontend reaches the API over the compose
            # network; the host binding is for curl/debug, not for the LAN.
            - 127.0.0.1:8080:8080
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "wget -qO- http://127.0.0.1:8080/healthz >/dev/null 2>&1 || exit 1",
                ]
            interval: 30s
            timeout: 3s
            retries: 3
            start_period: 15s
        logging:
            driver: json-file
            options:
                max-size: "10m"
                max-file: "3"
        deploy:
            resources:
                limits:
                    memory: 512M
                    cpus: "1.0"

    # Asynq worker (job planner: expiry alert, reorder calc, dll)
    # Dibangun dari Dockerfile yang sama dengan `api` (layer-cache membuat
    # build keduanya murah). Tag image BEDA dari api — bila dua service
    # mengekspor ke tag yang sama, `docker compose build` gagal
    # ("image already exists") karena keduanya dibangun paralel.
    worker:
        container_name: inventory_worker
        build:
            context: ./backend
            dockerfile: Dockerfile
        image: simbar-worker:latest
        restart: unless-stopped
        # Worker tidak mengekspos HTTP :8080, jadi HEALTHCHECK bawaan image
        # (ping /healthz) tak akan pernah lolos. Ganti dengan cek proses hidup.
        healthcheck:
            test:
                ["CMD-SHELL", "pgrep -f /app/worker >/dev/null 2>&1 || exit 1"]
            interval: 30s
            timeout: 3s
            retries: 3
            start_period: 10s
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_healthy
            migrate:
                condition: service_completed_successfully
        environment:
            - APP_ENV=development
            - DB_CONN_STRING=postgres://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-dbname}?sslmode=disable
            - REDIS_ADDR=redis:6379
            - JWT_SECRET=${JWT_SECRET:?set JWT_SECRET in .env (see .env.example)}
            - AES_ENCRYPTION_KEY=${AES_ENCRYPTION_KEY:?set AES_ENCRYPTION_KEY in .env (see .env.example)}
            - DB_POOL_MAX=10
            - DB_POOL_MIN=2
        command: ["/app/worker"]
        logging:
            driver: json-file
            options:
                max-size: "10m"
                max-file: "3"
        deploy:
            resources:
                limits:
                    memory: 512M
                    cpus: "1.0"

    # Frontend SPA (React + Vite) — image produksi: nginx statik + proxy /api
    # ke service `api`. Bundle dibangun di build-stage Dockerfile (VITE_API_BASE_URL
    # default /api/v1, same-origin lewat nginx — tanpa CORS). Host port 5173
    # dipetakan ke port 80 nginx agar URL tetap sama seperti mode dev.
    frontend:
        container_name: inventory_frontend
        build:
            context: ./frontend
            dockerfile: Dockerfile
            args:
                VITE_API_BASE_URL: /api/v1
        image: simbar-frontend:latest
        restart: unless-stopped
        depends_on:
            api:
                condition: service_healthy
        ports:
            - 5173:80
        deploy:
            resources:
                limits:
                    memory: 512M
                    cpus: "1.0"

volumes:
    postgres_data:
    redis_data:
