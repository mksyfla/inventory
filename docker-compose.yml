services:
    # PostgreSQL Database
    db:
        container_name: inventory_postgres
        environment:
            - POSTGRES_USER=user
            - POSTGRES_PASSWORD=password
            - POSTGRES_DB=dbname
        image: postgres:16
        ports:
            - 5432:5432
        volumes:
            - postgres_data:/var/lib/postgresql/data

    # Redis Cache
    redis:
        container_name: inventory_redis
        image: redis:8
        ports:
            - 6379:6379
        volumes:
            - redis_data:/data

volumes:
    postgres_data:
    redis_data:
